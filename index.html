<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RifLive</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap');
body{font-family:'Tajawal',sans-serif;background:#FFF9C4;color:#222}
.glass{background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,0.1);box-shadow:0 4px 10px rgba(0,0,0,0.05)}
@keyframes up{0%{transform:translateY(20px);opacity:0}15%{opacity:1}100%{transform:translateY(-100px);opacity:0}}
.float{animation:up 4s forwards}
</style>
</head>
<body>
<header class="p-4 flex justify-between sticky top-0 bg-[#FFF9C4]/90 z-50 backdrop-blur"><b class="text-black">🪐 RifLive</b><span id="red" class="hidden bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center">0</span></header>

<div class="p-4">
<div class="glass rounded-[2rem] overflow-hidden relative aspect-[9/14] max-w-sm mx-auto bg-black">
<video id="cam" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
<div id="overlay" class="absolute bottom-20 left-2 right-2 flex flex-col gap-2 pointer-events-none z-10"></div>
<div class="absolute top-3 left-3 z-20 flex gap-2"><span class="bg-red-600 text-white px-3 py-1 rounded-full text-xs">● LIVE</span><span id="st" class="bg-white/80 text-black px-3 py-1 rounded-full text-xs">OFF</span></div>
<div class="absolute bottom-3 left-3 right-3 z-20 flex gap-2">
<button onclick="startCam()" class="flex-1 bg-black text-white py-2.5 rounded-full font-bold text-sm">شغل الكاميرا</button>
<button onclick="flip()" class="w-10 h-10 rounded-full bg-white/80 flex items-center justify-center text-black"><i class="fa-solid fa-repeat"></i></button>
</div>
</div>

<div class="max-w-sm mx-auto mt-4">
<div class="flex gap-2"><input id="txt" placeholder="كتب تعليق..." class="flex-1 glass rounded-full px-4 py-3 text-sm outline-none text-black"><button onclick="addText(0)" class="bg-black text-white px-5 rounded-full text-sm font-bold">إرسال</button></div>
<div class="flex gap-2 mt-2">
<button id="vbtn" onclick="recVid()" class="flex-1 bg-red-600 text-white py-3 rounded-full font-bold text-sm"><i class="fa-solid fa-video"></i> تعليق بالفيديو 5s</button>
<button onclick="addText(1)" class="bg-yellow-400 text-black w-12 rounded-full">🔴</button>
</div>
<p id="rst" class="text-center text-xs mt-2 text-red-600 font-bold"></p>

<div class="mt-6 flex justify-between items-center">
<h3 class="font-bold text-black">💬 التعاليق (نص + فيديو)</h3>
<button onclick="clearAll()" class="bg-black text-white px-4 py-1.5 rounded-full text-xs"><i class="fa-solid fa-trash"></i> مسح الكل</button>
</div>

<div id="list" class="mt-3 space-y-3"></div>
</div>
</div>

<script>
let comments=JSON.parse(localStorage.getItem('rif_vid')||'[]');
let stream=null,facing='user',rec=null,isRec=false;
async function startCam(){let v=document.getElementById('cam');try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});v.srcObject=stream;await v.play();document.getElementById('st').innerText='ON';}catch(e){alert(e.message)}}
function flip(){facing=facing==='user'?'environment':'user';startCam()}
function addText(imp){let i=document.getElementById('txt');if(!i.value.trim())return;let o={t:'text',txt:i.value,imp:!!imp,time:new Date().toLocaleTimeString()};comments.unshift(o);save();i.value='';float(o.txt,o.imp)}
async function recVid(){
 if(!stream){await startCam()}
 if(isRec)return; isRec=true;
 let b=document.getElementById('vbtn'),s=document.getElementById('rst');
 let chunks=[]; rec=new MediaRecorder(stream,{mimeType:'video/webm'});
 rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)}
 rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let r=new FileReader();r.readAsDataURL(blob);r.onloadend=()=>{let o={t:'video',data:r.result,time:new Date().toLocaleTimeString()};comments.unshift(o);save();s.innerText='تم حفظ تعليق الفيديو ✅'};float('🎥 تعليق فيديو',0)};
 rec.start(); s.innerText='🔴 كنسجل 5 ثواني...'; let c=5; b.innerText='🔴 '+c; let iv=setInterval(()=>{c--;b.innerText='🔴 '+c; if(c<=0){clearInterval(iv);rec.stop();isRec=false;b.innerHTML='<i class="fa-solid fa-video"></i> تعليق بالفيديو 5s'}},1000)
}
function save(){localStorage.setItem('rif_vid',JSON.stringify(comments));render()}
function render(){let h='';comments.forEach((c,i)=>{if(c.t==='text'){h+=`<div class="glass rounded-2xl p-3 flex justify-between items-start ${c.imp?'border border-red-500 bg-red-100':''}"><div><p class="text-sm font-bold">${c.imp?'🔴 ':''}${c.txt}</p><p class="text-[10px] text-gray-500">${c.time}</p></div><button onclick="delOne(${i})" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button></div>`}else{h+=`<div class="glass rounded-2xl p-2"><video src="${c.data}" controls playsinline class="w-full rounded-xl h-40 bg-black object-cover"></video><div class="flex justify-between items-center mt-1"><p class="text-[10px] text-gray-500">${c.time}</p><button onclick="delOne(${i})" class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-[10px]">مسح</button></div></div>`}});document.getElementById('list').innerHTML=h||'<p class="text-center text-gray-400
