<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fix Glitch</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9C4;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.camBox{position:relative;height:40vh;background:#000;flex-shrink:0;overflow:hidden}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;background:#000}
.top{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:5px}
.top span{background:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.comsBox{flex:1;background:#f8f8f8;display:flex;flex-direction:column;overflow:hidden}
#coms{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.b{background:#fff;padding:8px 12px;border-radius:16px;font-size:12px;max-width:80%;box-shadow:0 1px 3px rgba(0,0,0,.1);align-self:flex-start}
.b.me{align-self:flex-end;background:#FFF9C4}
.b video{width:110px!important;height:150px!important;object-fit:cover;border-radius:10px;display:block;margin-top:4px}
.chatBar{background:#fff;border-top:1px solid #eee;padding:8px 10px 16px 10px}
</style></head><body>
<div class="app">
  <div class="camBox"><video id="cam" autoplay playsinline muted></video><div class="top"><span style="background:#E53935;color:#fff">LIVE</span><span>1.2K 👥</span></div></div>
  <div class="comsBox"><div id="coms"></div>
    <div class="chatBar">
      <div style="display:flex;gap:6px;align-items:center"><input id="txt" placeholder="كتب تعليق..." style="flex:1;background:#F0F0F0;border:none;padding:11px 14px;border-radius:24px;outline:none"><button onclick="rV()" style="border:none;background:#FFE3E8;width:40px;height:40px;border-radius:50%">📹</button><button onclick="send()" style="background:#000;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-weight:bold">إرسال</button><button onclick="start()" style="border:none;background:#E8F5E9;width:40px;height:40px;border-radius:50%">📷</button></div>
    </div>
  </div>
</div>
<script>
let camStream=null;
async function start(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());}
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
    camStream=s;
    let v=document.getElementById('cam');
    v.srcObject=s;
    await v.play();
  }catch(e){alert("دير Allow للكاميرا")}
}
function send(){
  if(!txt.value.trim())return;
  let d=document.createElement("div");d.className="b me";d.textContent=txt.value;
  let c=document.getElementById('coms');
  if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);
  txt.value="";
}
async function rV(){
  // وقف المعاينة قبل التسجيل باش ما يوقعش التخربيق
  if(camStream)camStream.getTracks().forEach(t=>t.stop());
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    let rec=new MediaRecorder(s),ch=[];
    rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=()=>{
      let u=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));
      let d=document.createElement("div");d.className="b me";
      d.innerHTML="<video src='"+u+"' controls playsinline></video>";
      let c=document.getElementById('coms');
      if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);
      s.getTracks().forEach(t=>t.stop());
      start(); // رجع الكاميرا
    };
    rec.start();
    setTimeout(()=>rec.stop(),3500);
  }catch(e){start();}
}
window.onload=start;
</script></body></html>
