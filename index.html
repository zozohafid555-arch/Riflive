
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RifLive - قريب وخا بعيد</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#000;color:white;overflow:hidden}
@keyframes spin{from{transform:rotate(-15deg)}to{transform:rotate(345deg)}}

/* الصفحة 1 */
#firstPage{position:fixed;inset:0;background:radial-gradient(circle at top,#0a4a8a,#00152a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center}
.saturn-big{width:110px;height:110px;background:#1976d2;border-radius:50%;border:6px solid white;position:relative;box-shadow:0 0 30px #1976d2}
.saturn-big::after{content:'';position:absolute;width:170%;height:40%;border:6px solid white;border-radius:50%;top:30%;left:-35%;animation:spin 4s linear infinite}
.logo{font-size:48px;font-weight:900;margin-top:25px;letter-spacing:-1px}
.logo b{color:#4da3ff}
.tag{color:#a0c8ff;margin:8px 0 25px}
#enterBtn{background:white;color:#0a4a8a;padding:14px 50px;border:none;border-radius:30px;font-weight:900;font-size:18px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}

/* اللايف */
#app{display:none;position:fixed;inset:0}
#video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.top{display:flex;justify-content:space-between}
.mini-logo{display:flex;align-items:center;gap:6px;background:white;color:#0a4a8a;padding:5px 12px;border-radius:20px;font-weight:900;font-size:13px}
.mini-logo i{width:18px;height:18px;background:#0a4a8a;border-radius:50%;border:2px solid #1976d2;display:block}
.live{background:#e6003c;padding:6px 14px;border-radius:8px;font-weight:bold;font-size:12px}
.leftBar{position:absolute;left:10px;top:38%;display:flex;flex-direction:column;gap:14px}
.iconBtn{width:44px;height:44px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;color:white}
#chat{position:absolute;bottom:130px;right:10px;left:70px;display:flex;flex-direction:column;gap:6px;max-height:35vh;overflow-y:auto}
.msg{background:rgba(255,255,255,0.95);color:black;padding:7px 12px;border-radius:16px;font-size:13px;width:fit-content;max-width:85%;display:flex;gap:6px;align-items:center}
.msg .s{width:16px;height:16px;background:#0a4a8a;border-radius:50%;border:2px solid #1976d2;flex-shrink:0}
.msg.me{background:#4da3ff;color:white}
.bottomNav{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(15px);display:flex;justify-content:space-around;padding:8px;border-top:1px solid rgba(255,255,255,0.1)}
.navBtn{color:white;font-size:11px;text-align:center;background:none;border:none}
.navBtn b{display:block;font-size:20px}
#inputBar{position:absolute;bottom:55px;left:10px;right:10px;background:white;border-radius:25px;display:flex;align-items:center;padding:6px 12px;gap:8px}
#inputBar input{flex:1;border:none;outline:none;color:black}
.coinBar{position:absolute;top:60px;right:10px;background:rgba(255,215,0,0.9);color:black;padding:4px 10px;border-radius:15px;font-size:12px;font-weight:bold}
</style>
</head>
<body>

<div id="firstPage">
<div class="saturn-big"></div>
<div class="logo">Rif<b>Live</b></div>
<div style="font-size:13px;letter-spacing:2px">حلقة الريف</div>
<div class="tag">قريب وخا بعيد - من الريف للعالم</div>
<button id="enterBtn" onclick="enter()">طلع لايف دابا 🔵</button>
<p style="margin-top:15px;font-size:11px;color:#7fb0ff">زحل يجمعنا</p>
</div>

<div id="app">
<video id="video" autoplay muted playsinline></video>
<div class="overlay">
<div class="top"><div class="mini-logo"><i></i>RifLive</div><div class="live">LIVE</div></div>
<div class="coinBar" id="coins">🪐 120 RifCoins</div>
<div class="leftBar">
<button class="iconBtn" onclick="sendGift()">🪐</button>
<button class="iconBtn" onclick="startRec()">🎥</button>
<button class="iconBtn" onclick="toggleMarket()">🛍️</button>
</div>
<div id="chat"></div>
<div id="inputBar">
<select id="lang" style="border:none;font-size:11px;background:#eee;border-radius:10px;padding:2px"><option>تريفيت</option><option>عربية</option><option>Español</option></select>
<input id="txt" placeholder="أضف تعليقا...">
<button onclick="sendMsg()" style="background:#0a4a8a;color:white;border:none;padding:6px 12px;border-radius:15px">إرسال</button>
</div>
<div class="bottomNav">
<button class="navBtn"><b>🏠</b>الرئيسية</button>
<button class="navBtn"><b>🎙️</b>غرف صوتية</button>
<button class="navBtn" style="background:white;color:#0a4a8a;width:50px;height:50px;border-radius:50%;margin-top:-20px"><b>+</b></button>
<button class="navBtn"><b>🛒</b>السوق</button>
<button class="navBtn"><b>👤</b>أنا</button>
</div>
</div>
</div>

<div id="market" style="position:fixed;bottom:0;left:0;right:0;background:white;color:black;border-radius:20px 20px 0 0;padding:15px;display:none;z-index:50;max-width:500px;margin:auto">
<div style="display:flex;justify-content:space-between"><h3>🛍️ سوق RifLive</h3><button onclick="toggleMarket()">✕</button></div>
<div style="display:flex;gap:10px;margin-top:10px;overflow-x:auto">
<div style="min-width:100px;background:#f5f5f5;padding:10px;border-radius:12px;text-align:center">🍯 عسل<br><small>150 Coins</small></div>
<div style="min-width:100px;background:#f5f5f5;padding:10px;border-radius:12px;text-align:center">🫒 زيت<br><small>120 Coins</small></div>
<div style="min-width:100px;background:#f5f5f5;padding:10px;border-radius:12px;text-align:center">👗 لباس<br><small>200 Coins</small></div>
</div>
</div>

<script>
let coins=120;
function enter(){document.getElementById('firstPage').style.display='none';document.getElementById('app').style.display='block';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>document.getElementById('video').srcObject=s);addMsg('نظام','تم حفظ الفيديو ✅',false,true)}
function addMsg(user,text,isMe,sys){
 let d=document.createElement('div');d.className='msg'+(isMe?' me':'');
 d.innerHTML=`<span class="s"></span><span><b>${user}:</b> ${text}</span>`;
 document.getElementById('chat').appendChild(d);
 document.getElementById('chat').scrollTop=9999;
}
function sendMsg(){
 let t=document.getElementById('txt').value;if(!t)return;
 let lang=document.getElementById('lang').value;
 let trans = lang==='Español' ? ' (ES: Hola)' : lang==='تريفيت' ? ' (Arif: Azul)' : '';
 addMsg('أنت',t+trans,true);document.getElementById('txt').value='';
}
function sendGift(){
 coins+=10;document.getElementById('coins').innerText='🪐 '+coins+' RifCoins';
 addMsg('أنت','صيفط حلقة زحل 🪐💙',true);
}
function toggleMarket(){let m=document.getElementById('market');m.style.display=m.style.display==='none'?'block':'none'}
function startRec(){addMsg('نظام','🎥 تعليق فيديو 15s - قريبا',false,true)}
</script>
</body>
</html>
