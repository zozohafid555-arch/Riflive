<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riflive - LIVE مجاني</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* اللايف */
#live{flex:3;position:relative;background:#111;overflow:hidden}
#live video{width:100%;height:100%;object-fit:cover}
#guest{position:absolute;right:10px;top:60px;width:120px;height:160px;border:3px solid #00ff00;border-radius:14px;overflow:hidden;background:#222;touch-action:none;cursor:grab;z-index:20;box-shadow:0 0 15px rgba(0,255,0,0.5)}
#guest video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.badge{position:absolute;top:15px;left:15px;background:red;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:13px;z-index:10;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}

/* الشات */
#chats{flex:2;display:flex;min-height:0}
.col{flex:1;overflow-y:auto;padding:6px}
.col:first-child{background:#121212;border-left:1px solid #333}
.col:last-child{background:#0a1a00}
.t{padding:8px;background:#333;font-weight:bold;font-size:12px;margin:-6px -6px 6px -6px;position:sticky;top:0;z-index:2}
.vip.t{background:#00ff00;color:#000}
.m{margin:6px 0;padding:8px 10px;border-radius:12px;font-size:12px;background:#222;cursor:pointer;word-break:break-word}
.vip.m{background:#fff;color:#000;font-weight:bold;display:flex;align-items:center;gap:6px;border:2px solid #00ff00}

/* التحت */
#bottom{padding:10px;background:#000;border-top:1px solid #333;display:flex;gap:8px;align-items:center}
#bottom input{flex:1;padding:12px 15px;border-radius:25px;border:0;background:#222;color:#fff;font-size:14px;outline:none}
.btn{padding:11px 16px;border-radius:25px;border:0;font-weight:bold;cursor:pointer;font-size:13px}
.red{background:red;color:#fff}
.gold{background:#00ff00;color:#000}

/* المودال */
#videoModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#videoModal video{width:92%;max-width:380px;height:62%;background:#222;border-radius:18px;border:3px solid #00ff00}
#videoModal button{margin-top:18px;padding:12px 35px;border-radius:25px;border:0;background:#00ff00;font-weight:bold;font-size:15px}
</style>
</head>
<body>

<div id="live">
  <video id="mainCam" autoplay muted playsinline></video>
  <div id="guest"><video id="guestCam" autoplay muted playsinline></video></div>
  <div class="badge">🔴 LIVE - مجاني</div>
</div>

<div id="chats">
  <div class="col" id="c1">
    <div class="t">💬 الدردشة العادية</div>
  </div>
  <div class="col vip" id="c2">
    <div class="t">🎥 تعليقات فيديو - مجاني ✅</div>
  </div>
</div>

<div id="bottom">
  <button class="btn gold" onclick="sendVideo()">📹 فيديو</button>
  <input id="inp" placeholder="كتب تعليق...">
  <button class="btn red" onclick="sendText()">إرسال</button>
</div>

<div id="videoModal" onclick="this.style.display='none'">
  <video id="bigVideo" autoplay loop playsinline></video>
  <button>إغلاق ✕</button>
  <p style="margin-top:10px;font-size:13px;color:#00ff00">🎥 مجاني 100% - جرب دابا!</p>
</div>

<script>
async function startCam(){
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    document.getElementById('mainCam').srcObject=s;
    document.getElementById('guestCam').srcObject=s;
    document.getElementById('bigVideo').srcObject=s;
  }catch(e){
    alert("خاصك تسمح للكاميرا: "+e.message);
  }
}

function sendText(){
  let i=document.getElementById('inp');
  if(!i.value.trim()) return;
  let d=document.createElement('div');
  d.className='m';
  d.textContent='أنت: '+i.value;
  document.getElementById('c1').appendChild(d);
  i.value='';
  document.getElementById('c1').scrollTop=document.getElementById('c1').scrollHeight;
}

function sendVideo(){
  let d=document.createElement('div');
  d.className='m vip';
  d.innerHTML='▶️ أنت: فيديو مباشر';
  d.onclick=()=>{document.getElementById('videoModal').style.display='flex';};
  document.getElementById('c2').appendChild(d);
  document.getElementById('c2').scrollTop=document.getElementById('c2').scrollHeight;
}

document.getElementById('inp').addEventListener('keypress',(e)=>{
  if(e.key==='Enter') sendText();
});

// سحب الكاميرا الصغيرة
let guest=document.getElementById('guest');
let isDragging=false, startX, startY, initialLeft, initialTop;
function startDrag(x,y){
  isDragging=true;
  startX=x; startY=y;
  initialLeft=guest.offsetLeft;
  initialTop=guest.offsetTop;
}
guest.addEventListener('touchstart', (e)=>{let t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:false});
guest.addEventListener('mousedown', (e)=>{startDrag(e.clientX,e.clientY);});
window.addEventListener('touchmove', (e)=>{
  if(!isDragging) return;
  e.preventDefault();
  let t=e.touches[0];
  guest.style.left=(initialLeft+t.clientX-startX)+'px';
  guest.style.top=(initialTop+t.clientY-startY)+'px';
  guest.style.right='auto';
},{passive:false});
window.addEventListener('mousemove', (e)=>{
  if(!isDragging) return;
  guest.style.left=(initialLeft+e.clientX-startX)+'px';
  guest.style.top=(initialTop+e.clientY-startY)+'px';
  guest.style.right='auto';
});
window.addEventListener('touchend', ()=>isDragging=false);
window.addEventListener('mouseup', ()=>isDragging=false);

startCam();
</script>
</body>
</html>
