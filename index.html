<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000"><title>RifLive PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100dvh;overflow:hidden}video#main{width:100%;height:100dvh;object-fit:cover;position:absolute}#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 20%,transparent 60%,rgba(0,0,0,.8) 100%)}#topBar{display:flex;justify-content:space-between;padding:12px;align-items:center}.profile{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.4);padding:4px 12px 4px 4px;border-radius:30px;border:1px solid rgba(255,255,255,.2)}.profile img{width:36px;height:36px;border-radius:50%}.liveTag{background:#ff004f;padding:4px 10px;border-radius:8px;font-weight:900;font-size:12px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.6}}#viewers{background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;font-size:13px}#sideBar{position:absolute;right:12px;bottom:180px;display:flex;flex-direction:column;gap:18px;align-items:center}.iconBtn{width:48px;height:48px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:0;color:#fff}.iconBtn.liked{background:#ff004f}#chatBox{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:35vh;overflow-y:auto}.chatMsg{font-size:14px;max-width:75%;animation:pop.3s}@keyframes pop{from{transform:translateY(10px);opacity:0}}.chatMsg b{color:#ffcc00}.chatMsg.gift{font-size:22px;display:block}.chatMsg video{width:90px;height:120px;border-radius:12px;object-fit:cover;margin-top:6px;border:2px solid #ff004f}#bottomBar{padding:10px;display:flex;gap:8px;align-items:center}.inputWrap{flex:1;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:30px;display:flex;padding:6px 14px;align-items:center}.inputWrap input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:14px}.sendBtn{background:#0095f6;color:#fff;border:0;padding:10px 18px;border-radius:30px;font-weight:bold}.giftBar{display:flex;gap:8px;padding:0 10px 6px;overflow-x:auto}.giftBar span{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px;font-size:18px;white-space:nowrap}#startScreen{position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}#startScreen h1{font-size:42px;background:linear-gradient(45deg,#0095f6,#ff004f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}#goLiveBtn{background:#fff;color:#000;border:0;padding:16px 50px;border-radius:30px;font-size:20px;font-weight:900}#hearts{position:absolute;right:20px;bottom:80px;pointer-events:none;z-index:5}</style></head><body>
<video id="main" autoplay muted playsinline></video>
<div id="hearts"></div>
<div id="ui">
<div id="topBar"><div class="profile">><img src="IMG-20260927-WA8030.jpg" style="background:#fff;object-fit:cover">div><<div style="font-size:13px;font-weight:bold">Rif1 ⵣ</<div style="font-size:11px;opacity:.8">@rif1</div>><button style="background:#0095f6;border:0;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;margin-right:8px">متابعة</button></div><div style="display:flex;gap:6px"><span class="liveTag">LIVE</span><span id="viewers">👁️ 1.2k</span></div></div>
<div><div id="sideBar"><button class="iconBtn" onclick="like()" id="likeBtn">❤️</button><span id="likeCount" style="font-size:12px">12.5k</span><button class="iconBtn" onclick="toggleRec()">🎥</button><button class="iconBtn">↗️</button></div><div id="chatBox"></div><div style="padding:0 10px 6px;display:flex;gap:6px"><button onclick="document.getElementById('chatBox').innerHTML='';addChat('تم مسح كل التعليقات 🧹','نظام')" style="background:rgba(255,0,79,.2);border:1px solid #ff004f;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px">🧹 مسح الكل</button><button onclick="alert('تم حفظ '+document.getElementById('chatBox').children.length+' تعليق 💾')" style="background:rgba(0,149,246,.2);border:1px solid #0095f6;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px">💾 حفظ الكل</button></div><span onclick="sendGift('🌹')">🌹 1</span><span onclick="sendGift('🔥')">🔥 10</span><span onclick="sendGift('💎')">💎 50</span><span onclick="sendGift('👑')">👑 100</span><span onclick="sendGift('🚀')">🚀 500</span></div><div id="bottomBar"><div class="inputWrap"><input id="msgInput" placeholder="أضف تعليقا..."><span>😊</span></div><button class="sendBtn" onclick="sendText()">إرسال</button></div></div>
</div>
<div id="startScreen"><h1>RifLive PRO</h1><p>تطبيق البث المباشر رقم 1 في الريف</p><p style="opacity:.6;font-size:13px">تعليق بالفيديو • هدايا • فلتر جمالي</p><button id="goLiveBtn" onclick="startLive()">🎥 بدأ البث المباشر</button></div>
<video id="prev" autoplay muted playsinline style="display:none;position:absolute;bottom:130px;right:10px;width:80px;height:110px;border-radius:12px;border:2px solid #ff004f;z-index:6;object-fit:cover"></video>
<script>
let likes=12500, viewers=1240, rec, chunks=[], isRec=false;
function startLive(){navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:720},audio:true}).then(s=>{document.getElementById('main').srcObject=s;document.getElementById('startScreen').style.display='none';setInterval(()=>{viewers+=Math.floor(Math.random()*5);document.getElementById('viewers').innerText='👁️ '+(viewers/1000).toFixed(1)+'k'},2000);addChat("مرحبا بالجميع فاللايف ديال الريف! ❤️","نظام");}).catch(()=>alert("عطي السماح للكاميرا"))}
function addChat(t,name,isVideo){
const b=document.getElementById('chatBox');
const d=document.createElement('div');
d.className='chatMsg';
d.style.position='relative';
d.style.background='rgba(255,255,255,.1)';
d.style.padding='8px 28px 8px 8px';
d.style.borderRadius='12px';
let content='';
if(isVideo){
const u=URL.createObjectURL(t);
d.dataset.url=u;
content=`<b>${name} 🎥</b><video src="${u}" autoplay loop muted playsinline></video><div style="display:flex;gap:6px;margin-top:4px"><button onclick="saveVideo(this)" style="background:#0095f6;border:0;color:#fff;padding:4px 8px;border-radius:10px;font-size:11px">💾 حفظ</button><button onclick="this.closest('.chatMsg').remove()" style="background:#ff004f;border:0;color:#fff;padding:4px 8px;border-radius:10px;font-size:11px">🗑️ مسح</button></div>`;
}else if(t.includes('🌹')||t.includes('🔥')||t.includes('💎')){
content=`<b>${name}</b> أرسل <span class="gift">${t}</span> <span onclick="this.parentElement.remove()" style="position:absolute;left:4px;top:4px;cursor:pointer">🗑️</span>`;
flyGift(t);
}else{
content=`<b>${name}:</b> ${t} <span onclick="this.parentElement.remove()" style="position:absolute;left:4px;top:4px;cursor:pointer;font-size:12px">❌</span>`;
}
d.innerHTML=content;
b.appendChild(d);
b.scrollTop=b.scrollHeight;
}
function saveVideo(btn){
const v=btn.closest('.chatMsg').querySelector('video');
const a=document.createElement('a');
a.href=v.src;
a.download='riflive-'+Date.now()+'.webm';
a.click();
addChat("تم حفظ الفيديو ✅","نظام");
}{const b=document.getElementById('chatBox');const d=document.createElement('div');d.className='chatMsg';if(isVideo){const u=URL.createObjectURL(t);d.innerHTML=`<b>${name} 🎥</b><video src="${u}" autoplay loop muted playsinline></video>`;}else if(t.includes('🌹')||t.includes('🔥')||t.includes('💎')){d.innerHTML=`<b>${name}</b> أرسل <span class="gift">${t}</span>`;flyGift(t)}else{d.innerHTML=`<b>${name}:</b> ${t}`;}b.appendChild(d);b.scrollTop=b.scrollHeight;}
function sendText(){const i=document.getElementById('msgInput');if(!i.value)return;addChat(i.value,"أنت");i.value="";}
function sendGift(g){addChat(g+" هدية!","أنت");likes+=parseInt(g.match(/\d+/)?.[0]||10);document.getElementById('likeCount').innerText=(likes/1000).toFixed(1)+'k';}
function like(){likes++;document.getElementById('likeCount').innerText=(likes/1000).toFixed(1)+'k';const h=document.createElement('div');h.innerText='❤️';h.style.position='absolute';h.style.right=Math.random()*60+20+'px';h.style.bottom='80px';h.style.fontSize='28px';h.style.animation='heartUp 2s forwards';document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),2000);document.getElementById('likeBtn').classList.add('liked');setTimeout(()=>document.getElementById('likeBtn').classList.remove('liked'),200)}
function flyGift(g){const e=document.createElement('div');e.innerText=g.split(' ')[0];e.style.position='absolute';e.style.left='50%';e.style.top='50%';e.style.fontSize='80px';e.style.zIndex='20';e.style.animation='pop 1s';document.body.appendChild(e);setTimeout(()=>e.remove(),1000);}
async function toggleRec(){if(!isRec){const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('prev').srcObject=s;document.getElementById('prev').style.display='block';chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});addChat(blob,"أنت",true);s.getTracks().forEach(t=>t.stop());document.getElementById('prev').style.display='none';};rec.start();isRec=true;setTimeout(()=>{if(isRec)toggleRec()},4000);}else{rec.stop();isRec=false;}}
const style=document.createElement('style');style.innerHTML='@keyframes heartUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-300px) scale(1.5);opacity:0}}';document.head.appendChild(style);
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});
</script></body></html>
