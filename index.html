<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RifLive PRO</title>
<style>
body{background:#FFF9C4;margin:0;padding:8px;font-family:system-ui}
.live{background:#000;border-radius:24px;padding:12px;height:340px;display:flex;flex-direction:column;justify-content:space-between}
.chat{background:#fff;border-radius:24px;margin-top:12px;padding:12px;min-height:400px;display:flex;flex-direction:column}
#comments{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.comment{background:#F5F5F5;padding:8px 12px;border-radius:16px;font-size:14px;max-width:80%}
.comment b{font-size:12px;display:block}
.comment video{width:100%;border-radius:12px;margin-top:6px}
.input-bar{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid #eee}
.input-bar input{flex:1;background:#F0F0F0;border:none;padding:12px 16px;border-radius:24px}
.btn-send{background:#000;color:#fff;border:none;padding:12px 18px;border-radius:24px;font-weight:bold}
.btn-vid{background:#FFE0E0;border:none;padding:10px;border-radius:50%;font-size:18px}
</style>
</head>
<body>

<div class="live">
<div style="display:flex;gap:6px">
<span style="background:#fff;padding:4px 10px;border-radius:12px;font-size:12px">OFF</span>
<span style="background:#E53935;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px">LIVE •</span>
<span style="background:#fff;padding:4px 10px;border-radius:12px;font-size:12px">👥 1</span>
</div>
<div style="text-align:center">
<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px">
<button style="border:none;padding:6px 12px;border-radius:16px">عادي</button>
<button style="border:none;padding:6px 12px;border-radius:16px">✨ تبييض</button>
<button style="border:none;padding:6px 12px;border-radius:16px">🌞 دافي</button>
<button style="border:none;padding:6px 12px;border-radius:16px">⚫ أسود</button>
<button style="border:none;padding:6px 12px;border-radius:16px">✧ ريفي</button>
</div>
<div style="display:flex;gap:6px;justify-content:center">
<button style="background:#E0E0E0;border:none;padding:8px 14px;border-radius:20px">🔄 قلب</button>
<button style="background:#E0E0E0;border:none;padding:8px 14px;border-radius:20px">📷 شغل</button>
<button style="background:#E53935;color:#fff;border:none;padding:8px 14px;border-radius:20px">🔴 سجل</button>
<button style="background:#00E676;border:none;padding:8px 14px;border-radius:20px">📈 بارطاجي</button>
</div>
</div>
</div>

<div class="chat">
<div id="comments">
<div class="comment"><b>ضيف:</b> 🔥❤️ مرحبا</div>
<!-- هنا كيبانو التعليقات بالفيديو -->
</div>

<div class="input-bar">
<span style="font-size:22px">❤️</span>
<input id="txt" placeholder="كتب تعليق...">
<button class="btn-vid" onclick="recordVideo()">📹</button>
<button class="btn-send" onclick="sendText()">إرسال</button>
</div>
</div>

<script>
function sendText(){
 let v=document.getElementById('txt').value;
 if(!v) return;
 let c=document.createElement('div'); c.className='comment'; c.innerHTML='<b>أنت:</b> '+v;
 document.getElementById('comments').appendChild(c);
 document.getElementById('txt').value='';
}
async function recordVideo(){
 alert('كيسجل فيديو 5 ثواني وكيحطو فالتعليقات');
 // هنا الكود ديال تسجيل الفيديو 5s
 let stream = await navigator.mediaDevices.getUserMedia({video:true});
 // ... كود التسجيل
}
</script>

</body>
</html>
