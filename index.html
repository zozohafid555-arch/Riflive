<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiiFlive - Front/Back Cam</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9C4;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.camBox{position:relative;height:45vh;background:#000;flex-shrink:0;overflow:hidden;display:flex}
#cam,#guest{width:100%;height:100%;object-fit:cover;background:#111}
.camBox.one #cam{width:100%}.camBox.two #cam,.camBox.two #guest{width:50%}
#cam.front{transform:scaleX(-1)} #cam.back{transform:scaleX(1)}
.top{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;justify-content:space-between}
.top span{background:rgba(255,255,255,.9);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.live{background:#E53935!important;color:#fff}
.camCtrl{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px}
.camCtrl button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;backdrop-filter:blur(5px)}
.pinArea{background:#FFF3CD;padding:7px 10px;border-bottom:2px solid #FFC107;display:none;align-items:center;gap:6px;font-size:12px}
.comsBox{flex:1;background:#f8f8f8;display:flex;flex-direction:column;overflow:hidden}
#coms{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.b{background:#fff;padding:8px 11px;border-radius:16px;font-size:12px;max-width:82%;box-shadow:0 1px 3px rgba(0,0,0,.1);align-self:flex-start}
.b.me{align-self:flex-end;background:#FFF9C4}
.b video{width:100px;height:135px;object-fit:cover;border-radius:10px;display:block;margin-top:4px}
.btns{display:flex;gap:4px;margin-top:5px}.btns button{border:none;padding:3px 7px;border-radius:10px;font-size:9px}
.btn-tr{background:#E3F2FD}.btn-pin{background:#FFF3CD}
.chatBar{background:#fff;border-top:1px solid #eee;padding:6px 8px 12px 8px}
</style></head><body>
<div class="app">
<div id="camBox" class="camBox one">
<video id="cam" class="front" autoplay playsinline muted></video>
<video id="guest" autoplay playsinline muted style="display:none"></video>
<div class="top"><span class="live">LIVE</span><span id="camLabel">📷 أمامية</span></div>
<div class="camCtrl">
<button onclick="toggleCam()" title="قلب الكاميرا">🔄</button>
<button onclick="toggleFlash()" id="flashBtn">⚡</button>
<button onclick="toggleGuest()">👥</button>
</div>
</div>

<div id="pinArea" class="pinArea"><span>📌</span><span id="pinText"></span><button onclick="unpin()" style="margin-right:auto;border:none;background:none">✖️</button></div>
<div id="coms" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#f8f8f8"></div>

<div class="chatBar"><div style="display:flex;gap:5px;align-items:center"><input id="txt" placeholder="كتب تعليق..." style="flex:1;background:#F0F0F0;border:none;padding:11px 14px;border-radius:24px;outline:none"><button onclick="rV()" style="border:none;background:#FFE3E8;width:40px;height:40px;border-radius:50%">📹</button><button onclick="send()" style="background:#000;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-weight:bold">إرسال</button></div></div>
</div>

<script>
let camStream=null,guestStream=null,currentFacing="user",torchOn=false;
async function start(facing=currentFacing){
 if(camStream)camStream.getTracks().forEach(t=>t.stop());
 try{
  let s=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}},
   audio:false
  });
  camStream=s;
  let v=document.getElementById('cam');
  v.srcObject=s;
  v.className=facing==="user"?"front":"back";
  document.getElementById('camLabel').innerText=facing==="user"?"📷 أمامية":"📷 خلفية";
  currentFacing=facing;
  await v.play();
 }catch(e){alert("ما كايناش كاميرا "+facing+" - جرب تسمح للكاميرا");}
}
function toggleCam(){
 let newFacing=currentFacing==="user"?"environment":"user";
 start(newFacing);
}
async function toggleFlash(){
 try{
  let track=camStream?.getVideoTracks()[0];
  if(!track)return;
  torchOn=!torchOn;
  await track.applyConstraints({advanced:[{torch:torchOn}]});
  document.getElementById('flashBtn').style.background=torchOn?"#FFC107":"rgba(0,0,0,.6)";
 }catch(e){alert("الفلاش خدام غير فالكاميرا الخلفية");}
}
async function toggleGuest(){
 let box=document.getElementById('camBox');
 if(box.classList.contains('one')){
  try{let s=await navigator.mediaDevices.getUserMedia({video:true});guestStream=s;guest.srcObject=s;guest.style.display='block';await guest.play();box.classList.remove('one');box.classList.add('two');}catch(e){}
 }else{ if(guestStream)guestStream.getTracks().forEach(t=>t.stop());guest.style.display='none';box.classList.remove('two');box.classList.add('one');}
}
function send(){
 if(!txt.value.trim())return;
 let d=document.createElement("div");d.className="b me";d.innerHTML=`<b>أنت:</b> ${txt.value}<div style="display:flex;gap:4px;margin-top:4px"><button class="btn-pin" onclick="pin(this)" style="background:#FFF3CD;border:none;padding:3px 7px;border-radius:10px;font-size:9px">📌 تثبيت</button><button class="btn-tr" onclick="tr(this)" style="background:#E3F2FD;border:none;padding:3px 7px;border-radius:10px;font-size:9px">🌐 ترجمة</button></div>`;
 let c=document.getElementById('coms');if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);txt.value="";
}
function pin(btn){pinArea.style.display='flex';pinText.innerText=btn.closest('.b').innerText.slice(0,40);}
function unpin(){pinArea.style.display='none';}
function tr(btn){
 let b=btn.closest('.b');
 let t=b.querySelector('.tr')||document.createElement('div');
 if(b.querySelector('.tr')){b.querySelector('.tr').remove();return;}
 t.className='tr';t.style.cssText='margin-top:4px;background:#F0F7FF;padding:5px;border-radius:6px;color:#1565C0;font-size:10px';t.innerText='Translated: Hello from Morocco';
 b.appendChild(t);
}
async function rV(){
 if(camStream)camStream.getTracks().forEach(t=>t.stop());
 try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});let rec=new MediaRecorder(s),ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{let u=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));let d=document.createElement("div");d.className="b me";d.innerHTML=`<video src="${u}" controls playsinline style="width:100px;height:135px;object-fit:cover;border-radius:10px"></video>`;let c=document.getElementById('coms');if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);s.getTracks().forEach(t=>t.stop());start(currentFacing);};rec.start();setTimeout(()=>rec.stop(),3500);}catch(e){start(currentFacing);}
}
window.onload=()=>start("user");
</script></body></html>
