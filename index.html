<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RifLive - zozohafid555</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9C4;height:100vh;display:flex;flex-direction:column}
.live-box{position:relative;background:#000;height:44vh;border-radius:0 0 28px 28px;overflow:hidden}
#cam{position:absolute;width:100%;height:100%;object-fit:cover;z-index:1}
.overlay{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.top-row{display:flex;gap:6px;justify-content:flex-end}
.top-row span{background:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.live{background:#E53935 !important;color:#fff}
.filters{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.filters button{border:none;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.9);font-size:12px}
.filters .active{background:#000;color:#fff}
.actions{display:flex;gap:6px;justify-content:center}
.actions button{border:none;padding:10px 16px;border-radius:20px;font-weight:bold;font-size:12px}
.a-green{background:#00E676}.a-red{background:#E53935;color:#fff}.a-gray{background:#fff}
.chat-box{background:#fff;flex:1;border-radius:28px 28px 0 0;margin-top:8px;display:flex;flex-direction:column;overflow:hidden}
.reply-bar{background:#FFE0B2;padding:8px 12px;display:none;justify-content:space-between;font-size:13px}
#comments{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{background:#F1F1F1;padding:10px 14px;border-radius:16px;max-width:88%;align-self:flex-end;line-height:1.4}
.bubble.reply{margin-right:20px;background:#E3F2FD;border:1px solid #90CAF9}
.bubble b{font-size:10px;color:#666;display:block}
.bubble video{width:100%;border-radius:10px;margin-top:6px}
.reply-btn{background:#000;color:#fff;border:none;padding:3px 10px;border-radius:10px;font-size:11px;margin-top:6px;display:inline-block}
.emoji-bar{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#FFFEF5;border-top:1px solid #FFE082}
.emoji-bar span{font-size:22px;cursor:pointer;flex-shrink:0}
.input-area{display:flex;gap:6px;align-items:center;padding:10px;border-top:1px solid #eee}
.input-area input{flex:1;background:#F0F0F0;border:none;padding:12px 16px;border-radius:24px;outline:none}
.btn-send{background:#000;color:#fff;border:none;padding:12px 18px;border-radius:24px;font-weight:bold}
.btn-cam{background:#FFE3E8;border:none;width:40px;height:40px;border-radius:50%}
</style>
</head>
<body>
<div class="live-box">
<video id="cam" autoplay playsinline muted></video>
<div class="overlay">
<div class="top-row"><span>OFF</span><span class="live">LIVE</span><span>👥 1</span></div>
<div>
<div class="filters">
<button class="active" onclick="setF('none',this)">عادي</button>
<button onclick="setF('bright',this)">✨ تبييض</button>
<button onclick="setF('warm',this)">🌞 دافي</button>
<button onclick="setF('bw',this)">⚫ أسود</button>
<button onclick="setF('rif',this)">✧ ريفي</button>
</div>
<div class="actions">
<button class="a-gray" onclick="flip()">🔄 قلب</button>
<button class="a-gray" onclick="start()">📷 شغل</button>
<button class="a-red">🔴 سجل</button>
<button class="a-green" onclick="share()">📈 بارطاجي</button>
</div>
</div>
</div>
</div>
<div class="chat-box">
<div id="replyBar" class="reply-bar"><span id="replyText"></span><button onclick="cancelR()" style="border:none;background:none">✖️</button></div>
<div id="comments">
<div class="bubble" id="c1"><b>ضيف:</b> مرحبا ❤️ <br><button class="reply-btn" onclick="setR('c1','مرحبا')">↩️ رد</button></div>
</div>
<div class="emoji-bar" id="emojiBar">
<span onclick="addE('❤️')">❤️</span><span onclick="addE('🔥')">🔥</span><span onclick="addE('😂')">😂</span><span onclick="addE('😍')">😍</span><span onclick="addE('👏')">👏</span><span onclick="addE('🥰')">🥰</span><span onclick="addE('💯')">💯</span><span onclick="addE('✨')">✨</span><span onclick="addE('🇲🇦')">🇲🇦</span>
</div>
<div class="input-area">
<span style="font-size:24px" onclick="toggleE()">😀</span>
<input id="txt" placeholder="كتب تعليق...">
<button class="btn-cam" onclick="recV()">📹</button>
<button class="btn-send" onclick="send()">إرسال</button>
</div>
</div>
<script>
let stream=null,facing="user",replyTo=null;
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});document.getElementById('cam').srcObject=s;stream=s;}catch(e){alert('دير Allow للكاميرا فالمتصفح');}}
function flip(){facing=facing=="user"?"environment":"user";start();}
function setF(f,el){let c=document.getElementById('cam');if(f=='none')c.style.filter='none';if(f=='bright')c.style.filter='brightness(1.3)';if(f=='warm')c.style.filter='sepia(.3)';if(f=='bw')c.style.filter='grayscale(1)';if(f=='rif')c.style.filter='saturate(1.4) contrast(1.2)';document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setR(id,t){replyTo=id;replyBar.style.display='flex';replyText.innerText='↩️ كترد على: '+t;txt.focus();}
function cancelR(){replyTo=null;replyBar.style.display='none';}
function addE(e){txt.value+=e;txt.focus();}
function toggleE(){let b=emojiBar;b.style.display=b.style.display=='none'?'flex':'none';}
function send(){if(!txt.value.trim())return;let d=document.createElement('div');d.className=replyTo?'bubble reply':'bubble';d.id='c'+Date.now();let onlyEmoji=/^[\p{Emoji}\s]+$/u.test(txt.value.trim());if(onlyEmoji)d.style.fontSize='32px';d.innerHTML='<b>'+(replyTo?'↩️ رد: ':'')+'أنت:</b> '+txt.value+'<br><button class="reply-btn" onclick="setR(\''+d.id+'\',\''+txt.value.substring(0,10).replace(/'/g,'')+'\')">↩️ رد</button>';comments.appendChild(d);txt.value='';cancelR();comments.scrollTop=99999;}
async function recV(){try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});let r=new MediaRecorder(s);let ch=[];r.ondataavailable=e=>ch.push(e.data);r.onstop=()=>{let u=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));let d=document.createElement('div');d.className=replyTo?'bubble reply':'bubble';d.id='c'+Date.now();d.innerHTML='<b>أنت فيديو:</b><video src="'+u+'" controls></video><br><button class="reply-btn" onclick="setR(\''+d.id+'\',\'فيديو\')">↩️ رد</button>';comments.appendChild(d);cancelR();s.getTracks().forEach(t=>t.stop());};r.start();setTimeout(()=>r.stop(),5000);alert('كيسجل 5 ثواني...');}catch(e){alert('الكاميرا ما خداماش');}}
function share(){if(navigator.share)navigator.share({url:location.href});else alert(location.href);}
window.onload=start;
</script>
</body>
</html>
