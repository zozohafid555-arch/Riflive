<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RifLive PRO - zozohafid555</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#FFF9C4;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.live-box{position:relative;background:#000;height:46vh;border-radius:0 0 28px 28px;overflow:hidden;flex-shrink:0}
#cam{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}
.overlay{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.top-row{display:flex;gap:6px;justify-content:flex-end}
.top-row span{background:rgba(255,255,255,.9);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold}
.top-row .live{background:#E53935;color:#fff}
.filters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:none;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.85);font-size:13px}
.filters .active{background:#000;color:#fff}
.actions{display:flex;gap:8px;justify-content:center}
.actions button{border:none;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:bold}
.a-green{background:#00E676}.a-red{background:#E53935;color:#fff}.a-gray{background:#fff}
.chat-box{background:#fff;flex:1;border-radius:28px 28px 0 0;margin-top:10px;display:flex;flex-direction:column;overflow:hidden}
.reply-bar{background:#FFF3E0;padding:8px 14px;display:none;justify-content:space-between;font-size:13px;border-bottom:1px solid #FFE0B2}
#comments{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{background:#F1F1F1;padding:12px 16px;border-radius:18px;max-width:85%;align-self:flex-end;position:relative;word-break:break-word;line-height:1.4}
.bubble.reply{margin-right:24px;background:#E3F2FD;border:1px solid #90CAF9}
.bubble b{display:block;font-size:11px;color:#777;margin-bottom:2px}
.bubble video{width:100%;border-radius:12px;margin-top:6px;max-height:200px}
.reply-btn{position:absolute;left:-34px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer}
.emoji-bar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#FFFEF5;border-top:1px solid #FFE082;flex-shrink:0}
.emoji-bar span{font-size:24px;cursor:pointer;flex-shrink:0;padding:4px;background:#fff;border-radius:10px}
.input-area{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eee;background:#fff}
.input-area input{flex:1;background:#F0F0F0;border:none;padding:14px 18px;border-radius:28px;outline:none;font-size:14px}
.btn-send{background:#000;color:#fff;border:none;padding:14px 20px;border-radius:28px;font-weight:bold}
.btn-cam{background:#FFE3E8;border:none;width:42px;height:42px;border-radius:50%;font-size:18px}
.btn-emoji{border:none;background:none;font-size:26px}
</style>
</head>
<body>

<div class="live-box">
<video id="cam" autoplay playsinline muted></video>
<div class="overlay">
<div class="top-row"><span>OFF</span><span class="live">LIVE •</span><span>👥 1</span></div>
<div>
<div class="filters">
<button class="active" onclick="setFilter('none',this)">عادي</button>
<button onclick="setFilter('bright',this)">✨ تبييض</button>
<button onclick="setFilter('warm',this)">🌞 دافي</button>
<button onclick="setFilter('bw',this)">⚫ أسود</button>
<button onclick="setFilter('rif',this)">✧ ريفي</button>
</div>
<div class="actions">
<button class="a-gray" onclick="flipCam()">🔄 قلب</button>
<button class="a-gray" onclick="startCam()">📷 شغل</button>
<button class="a-red" onclick="alert('سجلت 📸')">🔴 سجل</button>
<button class="a-green" onclick="navigator.share?navigator.share({url:location.href}):alert(location.href)">📈 بارطاجي</button>
</div>
</div>
</div>
</div>

<div class="chat-box">
<div id="replyBar" class="reply-bar"><span id="replyText"></span><button onclick="cancelReply()" style="border:none;background:none">✖️</button></div>
<div id="comments">
<div class="bubble" id="c1"><b>ضيف:</b> مرحبا ❤️🔥 <button class="reply-btn" onclick="setReply('c1','مرحبا')">↩️</button></div>
</div>
<div class="emoji-bar" id="emojiBar">
<span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('👏')">👏</span><span onclick="addEmoji('🥰')">🥰</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('👑')">👑</span><span onclick="addEmoji('💪')">💪</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('🤣')">🤣</span><span onclick="addEmoji('🇲🇦')">🇲🇦</span><span onclick="addEmoji('❤️‍🔥')">❤️‍🔥</span>
</div>
<div class="input-area">
<button class="btn-emoji" onclick="toggleEmoji()">😀</button>
<input id="txtInput" placeholder="كتب تعليق..." onkeypress="if(event.key==='Enter')sendMsg()">
<button class="btn-cam" onclick="recordReplyVideo()">📹</button>
<button class="btn-send" onclick="sendMsg()">إرسال</button>
</div>
</div>

<script>
let currentStream=null,facing="user",replyTo=null;
const cam=document.getElementById('cam');
async function startCam(){try{if(currentStream)currentStream.getTracks().forEach(t=>t.stop());let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});cam.srcObject=s;currentStream=s;}catch(e){alert('خاصك تسمح للكاميرا - دير Allow');}}
function flipCam(){facing=facing=="user"?"environment":"user";startCam();}
function setFilter(f,el){if(f=='none')cam.style.filter='none';if(f=='bright')cam.style.filter='brightness(1.3) contrast(1.1)';if(f=='warm')cam.style.filter='sepia(.3) brightness(1.1)';if(f=='bw')cam.style.filter='grayscale(1)';if(f=='rif')cam.style.filter='contrast(1.2) saturate(1.3)';document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setReply(id,text){replyTo=id;document.getElementById('replyBar').style.display='flex';document.getElementById('replyText').innerText='↩️ كترد على: '+text;document.getElementById('txtInput').focus();}
function cancelReply(){replyTo=null;document.getElementById('replyBar').style.display='none';}
function addEmoji(e){let i=document.getElementById('txtInput');i.value+=e;i.focus();}
function toggleEmoji(){let b=document.getElementById('emojiBar');b.style.display=b.style.display=='none'?'flex':'none';}
function sendMsg(){
 let inp=document.getElementById('txtInput');if(!inp.value.trim())return;
 let isOnlyEmoji=/^[\p{Emoji}\s]+$/u.test(inp.value.trim())&&inp.value.trim().length<=10;
 let div=document.createElement('div');div.className=replyTo?'bubble reply':'bubble';div.id='c'+Date.now();
 if(isOnlyEmoji)div.style.fontSize='34px';
 div.innerHTML='<b>'+(replyTo?'↩️ رد: ':'')+'أنت:</b> '+inp.value+'<button class="reply-btn" onclick="setReply(\''+div.id+'\',\''+inp.value.substring(0,12).replace(/'/g,'')+'\')">↩️</button>';
 document.getElementById('comments').appendChild(div);
 inp.value='';cancelReply();document.getElementById('comments').scrollTop=999999;
}
async function recordReplyVideo(){
 try{
  let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  let rec=new MediaRecorder(s);let chunks=[];
  alert('كيسجل فيديو 5 ثواني...');
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
   let url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
   let div=document.createElement('div');div.className=replyTo?'bubble reply':'bubble';div.id='c'+Date.now();
   div.innerHTML='<b>أنت ↩️ فيديو:</b><video src="'+url+'" controls></video><button class="reply-btn" onclick="setReply(\''+div.id+'\',\'فيديو\')">↩️</button>';
   document.getElementById('comments').appendChild(div);cancelReply();
   s.getTracks().forEach(t=>t.stop());
  };
  rec.start();setTimeout(()=>rec.stop(),5000);
 }catch(e){alert('ما قدرناش نشغلو الكاميرا');}
}
window.onload=startCam;
</script>
</body>
</html>
