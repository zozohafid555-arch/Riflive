<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiiFlive - FINAL ALL FEATURES</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9C4;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.camBox{position:relative;height:42vh;background:#000;flex-shrink:0;overflow:hidden;display:flex}
.camBox.one #cam{width:100%}.camBox.two #cam,.camBox.two #guest{width:50%;height:100%;object-fit:cover}
#cam,#guest{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
.top{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;justify-content:space-between}
.topL,.topR{display:flex;gap:5px}.top span{background:rgba(255,255,255,.9);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.live{background:#E53935!important;color:#fff}.recDot{background:#000!important;color:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.giftAnim{position:absolute;inset:0;pointer-events:none;z-index:4;display:flex;align-items:center;justify-content:center;font-size:80px;animation:giftPop 1.5s ease}
@keyframes giftPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.pinArea{background:#FFF3CD;padding:7px 10px;border-bottom:2px solid #FFC107;display:none;align-items:center;gap:6px;font-size:12px}
.statsBar{background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-around;padding:6px;font-size:11px}
.comsBox{flex:1;background:#f8f8f8;display:flex;flex-direction:column;overflow:hidden}
#coms{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.b{background:#fff;padding:8px 11px;border-radius:16px;font-size:12px;max-width:82%;box-shadow:0 1px 3px rgba(0,0,0,.1);align-self:flex-start}
.b.me{align-self:flex-end;background:#FFF9C4}
.b b{font-size:9px;color:#888;display:block}.b video{width:100px;height:135px;object-fit:cover;border-radius:10px;display:block;margin-top:4px}
.btns{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.btns button{border:none;padding:3px 7px;border-radius:10px;font-size:9px;cursor:pointer}
.btn-tr{background:#E3F2FD}.btn-pin{background:#FFF3CD}.btn-reply{background:#000;color:#fff}.trText{margin-top:4px;padding:5px 7px;background:#F0F7FF;border-radius:6px;font-size:10px;color:#1565C0;display:none}
.chatBar{background:#fff;border-top:1px solid #eee;padding:6px 8px 12px 8px}
.emRow{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.emRow span{font-size:18px;cursor:pointer;flex-shrink:0}
.giftRow{display:flex;gap:6px;margin:4px 0}.giftRow button{border:none;background:#FFF0F5;padding:5px 10px;border-radius:20px;font-size:11px}
</style></head><body>
<div class="app">
<div id="camBox" class="camBox one"><video id="cam" autoplay playsinline muted></video><video id="guest" autoplay playsinline muted style="display:none"></video>
<div class="top"><div class="topL"><span class="live">LIVE</span><span id="viewC">1.2K 👥</span><span id="recLab" style="display:none" class="recDot">● REC 00:00</span></div><div class="topR"><span id="dur">00:00</span><span id="likeC">❤️ 0</span></div></div>
<div id="giftLayer"></div></div>

<div id="pinArea" class="pinArea"><span>📌</span><span id="pinText"></span><button onclick="unpin()" style="margin-right:auto;border:none;background:none">✖️</button></div>
<div class="statsBar"><span>⏱️ <b id="sDur">00:00</b></span><span>💬 <b id="sCom">0</b></span><span>👤 <b id="sView">1200</b></span><span>🎁 <b id="sGift">0</b></span></div>

<div class="comsBox"><div id="coms"></div>
<div class="chatBar">
<div class="emRow"><span onclick="addE('❤️')">❤️</span><span onclick="addE('🔥')">🔥</span><span onclick="addE('😂')">😂</span><span onclick="addE('😍')">😍</span><span onclick="addE('👏')">👏</span><span onclick="addE('🇲🇦')">🇲🇦</span><span onclick="addE('💯')">💯</span><span onclick="addE('🌹')">🌹</span></div>
<div class="giftRow"><button onclick="sendGift('🌹',10)">🌹 10</button><button onclick="sendGift('🦁',100)">🦁 100</button><button onclick="sendGift('💎',500)">💎 500</button><button onclick="toggleGuest()">👥 ضيف</button><button onclick="toggleRec()" id="recBtn">⏺️ تسجيل</button></div>
<div style="display:flex;gap:5px;align-items:center;margin-top:4px"><button onclick="start()" style="border:none;background:#E8F5E9;width:36px;height:36px;border-radius:50%">📷</button><input id="txt" placeholder="كتب تعليق..." style="flex:1;background:#F0F0F0;border:none;padding:10px 12px;border-radius:24px;outline:none;font-size:12px"><button onclick="rV()" style="border:none;background:#FFE3E8;width:36px;height:36px;border-radius:50%">📹</button><button onclick="send()" style="background:#000;color:#fff;border:none;padding:10px 16px;border-radius:24px;font-weight:bold;font-size:12px">إرسال</button></div>
</div></div></div>

<script>
let camStream=null,guestStream=null,recorder=null,recChunks=[],isRec=false,recTimer=null,sec=0,totalSec=0,comCount=0,giftCount=0,likeCount=0;
const badWords=["زامل","قحبة","سب","كلب"];
async function start(){if(camStream)camStream.getTracks().forEach(t=>t.stop());try{let s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});camStream=s;cam.srcObject=s;await cam.play();}catch(e){}}
function addE(e){txt.value+=e;txt.focus();}
function filterBad(t){let low=t.toLowerCase();for(let w of badWords){if(low.includes(w))return true;}return false;}
function send(){
 let v=txt.value.trim();if(!v)return;
 if(filterBad(v)){alert("🚫 تعليق غير مقبول");return;}
 let d=document.createElement("div");d.className="b me";
 d.innerHTML=`<b>أنت:</b> <span class="orig">${v}</span><div class="trText"></div><div class="btns"><button class="btn-tr" onclick="tr(this)">🌐 ترجمة</button><button class="btn-pin" onclick="pin(this)">📌 تثبيت</button><button class="btn-reply" onclick="reply(this)">↩️ رد</button></div>`;
 let c=document.getElementById('coms');if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);
 txt.value="";comCount++;sCom.innerText=comCount;
}
function tr(btn){let box=btn.closest('.b');let o=box.querySelector('.orig').innerText;let t=box.querySelector('.trText');if(t.style.display==='block'){t.style.display='none';btn.innerText='🌐 ترجمة';return;}let dict={"مرحبا":"Hello","زوين":"Beautiful","الله يحفظك":"God bless you"};t.innerText=dict[o]||o+" -> Translated to English";t.style.display='block';btn.innerText='❌ إخفاء';}
function pin(btn){let tx=btn.closest('.b').querySelector('.orig')?.innerText||"فيديو";pinArea.style.display='flex';pinText.innerText=tx.slice(0,40);}
function unpin(){pinArea.style.display='none';}
function reply(btn){let t=btn.closest('.b').querySelector('.orig')?.innerText||"";txt.value="@"+t.slice(0,12)+" ";txt.focus();}
function sendGift(icon,val){
 giftCount+=val;likeCount+=val;sGift.innerText=giftCount;likeC.innerText="❤️ "+likeCount;
 let layer=document.getElementById('giftLayer');let el=document.createElement('div');el.className='giftAnim';el.innerText=icon;layer.appendChild(el);
 let d=document.createElement("div");d.className="b";d.innerHTML=`<b>هدية:</b> أرسل ${icon} بقيمة ${val}`;let c=document.getElementById('coms');if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);
 setTimeout(()=>el.remove(),1500);
}
async function rV(){
 if(camStream)camStream.getTracks().forEach(t=>t.stop());
 try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});let rec=new MediaRecorder(s),ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{let u=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));let d=document.createElement("div");d.className="b me";d.innerHTML=`<b>فيديو:</b><video src="${u}" controls playsinline></video><div class="btns"><button class="btn-tr" onclick="tr(this)">🌐 ترجمة</button><button class="btn-pin" onclick="pin(this)">📌 تثبيت</button></div>`;let c=document.getElementById('coms');if(c.firstChild)c.insertBefore(d,c.firstChild);else c.appendChild(d);s.getTracks().forEach(t=>t.stop());start();};rec.start();setTimeout(()=>rec.stop(),3500);}catch(e){start();}
}
async function toggleGuest(){
 let box=document.getElementById('camBox');
 if(box.classList.contains('one')){
  try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});guestStream=s;guest.srcObject=s;guest.style.display='block';await guest.play();box.classList.remove('one');box.classList.add('two');}catch(e){}
 }else{ if(guestStream)guestStream.getTracks().forEach(t=>t.stop());guest.style.display='none';box.classList.remove('two');box.classList.add('one');}
}
function toggleRec(){
 if(!isRec){
  isRec=true;recLab.style.display='inline-block';recBtn.innerText='⏹️ حفظ';recBtn.style.background='#E53935';recBtn.style.color='#fff';
  sec=0;recTimer=setInterval(()=>{sec++;totalSec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');recLab.innerText=`● REC ${m}:${s}`;dur.innerText=`${m}:${s}`;sDur.innerText=`${m}:${s}`;},1000);
 }else{
  isRec=false;recLab.style.display='none';recBtn.innerText='⏺️ تسجيل';recBtn.style.background='';recBtn.style.color='';clearInterval(recTimer);
  alert("✅ تم حفظ اللايف - المدة: "+sDur.innerText);
 }
}
setInterval(()=>{totalSec++;let m=String(Math.floor(totalSec/60)).padStart(2,'0');let s=String(totalSec%60).padStart(2,'0');if(!isRec)dur.innerText=`${m}:${s}`;},1000);
window.onload=start;
</script></body></html>
