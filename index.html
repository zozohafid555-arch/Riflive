<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riflive - LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
#live{flex:3;position:relative;background:#111;overflow:hidden}
#live video{width:100%;height:100%;object-fit:cover}
#guest{position:absolute;right:10px;top:60px;width:110px;height:150px;border:2px solid #ffaa00;border-radius:12px;overflow:hidden;background:#222}
#guest video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:15px;left:15px;background:red;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px;z-index:10}
#chats{flex:2;display:flex}
.col{flex:1;overflow-y:auto;padding:5px}
.col:first-child{background:#121212;border-left:1px solid #333}
.col:last-child{background:#1a1600}
.t{padding:6px;background:#333;font-weight:bold;font-size:11px;margin:-5px -5px 5px -5px}
.vip .t{background:#ffaa00;color:#000}
.m{margin:4px 0;padding:6px;border-radius:8px;font-size:11px;background:#222}
.vip .m{background:#fff;color:#000;font-weight:bold;display:flex;align-items:center;gap:5px}
#bottom{padding:8px;background:#000;border-top:1px solid #333;display:flex;gap:6px;align-items:center}
#bottom input{flex:1;padding:10px;border-radius:20px;border:0;background:#222;color:#fff}
.btn{padding:8px 12px;border-radius:20px;border:0;font-weight:bold;cursor:pointer}
.red{background:red;color:#fff}
.gold{background:#ffaa00;color:#000}
</style>
</head>
<body>
<div id="live">
  <video id="mainCam" autoplay muted playsinline></video>
  <div id="guest"><video id="guestCam" autoplay muted playsinline></video></div>
  <div class="badge">🔴 LIVE 1.3K - Riflive</div>
</div>
<div id="chats">
  <div class="col" id="c1"><div class="t">💬 الدردشة العادية</div></div>
  <div class="col vip" id="c2"><div class="t">🎥 الساحة VIP - تعليق فيديو</div></div>
</div>
<div id="bottom">
  <button class="btn gold" onclick="sendVideo()">📹</button>
  <input id="inp" placeholder="كتب تعليق...">
  <button class="btn red" onclick="sendText()">إرسال</button>
</div>
<script>
async function startCam(){try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('mainCam').srcObject=s;document.getElementById('guestCam').srcObject=s;}catch(e){}}
function sendText(){let i=document.getElementById('inp');if(!i.value)return;let d=document.createElement('div');d.className='m';d.textContent='أنت: '+i.value;document.getElementById('c1').appendChild(d);i.value='';}
function sendVideo(){let d=document.createElement('div');d.className='m';d.innerHTML='▶️ أنت: فيديو 5s <b>50c</b>';document.getElementById('c2').appendChild(d);}
startCam();
// تعليقات وهمية باش تبان عامرة
setTimeout(()=>{document.getElementById('c1').innerHTML+='<div class=m>Youssef: واعر 🔥</div><div class=m>Ahmed: El Ejido حاضر</div>';document.getElementById('c2').innerHTML+='<div class=m>⭐ Karim: أسد 🦁 100c</div><div class=m>▶️ Sara: فيديو سؤال 50c</div>';},500);
</script>
</body>
</html>
