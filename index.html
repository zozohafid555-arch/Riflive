<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RifLive PRO - zozohafid555</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9C4;padding:8px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px}
.header h1{font-size:18px;font-weight:bold}
.tabs{display:flex;gap:8px}
.tabs button{border:none;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.tabs .active{background:#000;color:#fff}
.tabs .inactive{background:#eee}
.live-box{background:#000;border-radius:20px;padding:12px;position:relative;height:310px;display:flex;flex-direction:column;justify-content:space-between}
.top-badges{display:flex;justify-content:flex-end;gap:6px}
.badge{background:#fff;color:#000;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.badge.live{background:#E53935;color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.filters button{background:#E0E0E0;border:none;padding:6px 12px;border-radius:16px;font-size:12px}
.actions{display:flex;gap:6px;justify-content:center;margin-top:8px}
.actions button{border:none;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-green{background:#00E676;color:#000}
.btn-red{background:#E53935;color:#fff}
.btn-gray{background:#E0E0E0}
.chat-area{background:#fff;border-radius:20px;margin-top:10px;padding:12px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end}
.input-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.input-row .send{background:#000;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:bold}
.input-row .input{flex:1;background:#F5F5F5;border:none;padding:10px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="header">
<h1>RifLive PRO ✧</h1>
<div class="tabs">
<button class="inactive">المنشورات</button>
<button class="active">لايف</button>
</div>
</div>

<div class="live-box">
<div class="top-badges">
<span class="badge">1 👥</span>
<span class="badge live">• LIVE</span>
<span class="badge">OFF</span>
</div>
<div>
<div class="filters">
<button>عادي</button>
<button>✨ تبييض</button>
<button>🌞 دافي</button>
<button>⚫ أسود</button>
<button>✧ ريفي</button>
</div>
<div class="actions">
<button class="btn-gray">🔄 قلب</button>
<button class="btn-gray">📷 شغل</button>
<button class="btn-red">🔴 سجل</button>
<button class="btn-green">📈 بارطاجي</button>
</div>
</div>
</div>

<div class="chat-area">
<!-- هنا حيدت المستطيل ديال فيديو 5s -->
<div class="input-row">
<button class="send">إرسال</button>
<input class="input" placeholder="كتب تعليق...">
<span>❤️</span>
</div>
</div>
</body>
</html>
