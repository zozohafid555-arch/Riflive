<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riflive - جديد الفوق</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#FFF9C4;display:flex;justify-content:center}.app{width:100%;max-width:420px;background:#fff;height:100vh;display:flex;flex-direction:column}.live{position:relative;background:#000;height:58vh;overflow:hidden}#cam{width:100%;height:100%;object-fit:cover;position:absolute}.ov{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px}.top{display:flex;justify-content:flex-end;gap:6px}.top span{background:#fff;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}.ld{background:#E53935!important;color:#fff}.filters{display:flex;gap:5px;justify-content:center}.filters button{border:none;padding:6px 11px;border-radius:20px;font-size:11px;background:rgba(0,0,0,.6);color:#fff}.filters .on{background:#fff;color:#000}.comsOver{position:absolute;bottom:105px;left:8px;right:8px;z-index:3;max-height:36vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.b{background:rgba(255,255,255,.95);padding:9px 12px;border-radius:16px;font-size:13px;max-width:88%;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,.2)}.b.me{align-self:flex-end;background:#E3F2FD}.b.re{margin-right:16px;background:#FFF9C4;border:1px solid #FFD54F;align-self:flex-start}.b b{font-size:9px;color:#555;display:block}.b video{width:160px;border-radius:10px;margin-top:5px;max-height:130px}.rb{border:none;background:#000;color:#fff;padding:3px 9px;border-radius:10px;font-size:10px;margin-top:4px}.chatBar{position:absolute;bottom:0;left:0;right:0;z-index:4;background:#fff;border-radius:22px 22px 0 0;padding:10px}.rep{display:none;justify-content:space-between;background:#FFE0B2;padding:6px 10px;border-radius:10px;font-size:11px;margin-bottom:6px}.em{display:flex;gap:5px;overflow-x:auto;padding:5px 0}.em span{font-size:20px;cursor:pointer;background:#FFFEF5;padding:3px 6px;border-radius:8px}.inp{display:flex;gap:5px;align-items:center}.inp input{flex:1;background:#F0F0F0;border:none;padding:11px 14px;border-radius:24px;outline:none}</style></head><body><div class="app"><div class="live"><video id="cam" autoplay playsinline muted></video><div class="ov"><div class="top"><span>👥 1.2K</span><span class="ld">LIVE</span></div><div class="filters"><button class="on" onclick="fl('none',this)">عادي</button><button onclick="fl('bright',this)">✨ تبييض</button><button onclick="fl('warm',this)">🌞 دافي</button><button onclick="fl('bw',this)">⚫ أسود</button></div></div><div id="coms" class="comsOver"><div class="b"><b>أحمد:</b> مرحبا من الحسيمة ❤️<br><button class="rb" onclick="sR(this,'مرحبا')">↩️ رد</button></div></div><div class="chatBar"><div id="reBar" class="rep"><span id="reTx"></span><button onclick="cR()" style="border:none;background:none">✖️</button></div><div class="em"><span onclick="aE('❤️')">❤️</span><span onclick="aE('🔥')">🔥</span><span onclick="aE('😂')">😂</span><span onclick="aE('😍')">😍</span><span onclick="aE('👏')">👏</span><span onclick="aE('🇲🇦')">🇲🇦</span><span onclick="aE('💯')">💯</span></div><div class="inp"><input id="txt" placeholder="كتب تعليق..."><button onclick="rV()" style="border:none;background:#FFE3E8;width:38px;height:38px;border-radius:50%">📹</button><button onclick="send()" style="background:#000;color:#fff;border:none;padding:11px 16px;border-radius:24px;font-weight:bold">إرسال</button><button onclick="start()" style="border:none;background:#E8F5E9;width:38px;height:38px;border-radius:50%">📷</button></div></div></div></div><script>let st=null,face="user",rToEl=null,rToTx="";async function start(){try{if(st)st.getTracks().forEach(t=>t.stop());let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:true});cam.srcObject=s;st=s;}catch(e){alert("دير Allow للكاميرا 🔒")}}function sR(btn,tx){rToEl=btn.parentElement;rToTx=tx;reBar.style.display="flex";reTx.innerText="↩️ كترد على: "+tx;txt.focus()}function cR(){rToEl=null;reBar.style.display="none"}function aE(e){txt.value+=e;txt.focus()}function send(){if(!txt.value.trim())return;let d=document.createElement("div");d.className=rToEl?"b re":"b me";d.innerHTML=(rToEl?"<b>↩️ رد على "+rToTx+":</b> ":"<b>أنت:</b> ")+txt.value+"<br><button class='rb' onclick=\"sR(this,'"+txt.value.slice(0,12).replace(/'/g,"")+"')\">↩️ رد</button>";coms.prepend(d);txt.value="";cR();coms.scrollTop=0}async function rV(){try{let s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});let rec=new MediaRecorder(s),ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{let u=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));let d=document.createElement("div");d.className=rToEl?"b re":"b me";d.innerHTML=(rToEl?"<b>↩️ رد فيديو على "+rToTx+":</b>":"<b>أنت فيديو:</b>")+"<video src='"+u+"' controls></video><br><button class='rb' onclick=\"sR(this,'فيديو')\">↩️ رد</button>";coms.prepend(d);cR();s.getTracks().forEach(t=>t.stop());coms.scrollTop=0};rec.start();setTimeout(()=>rec.stop(),5000);alert("كيسجل 5 ثواني...")}catch(e){alert("الكاميرا")}}function fl(f,el){if(f=="none")cam.style.filter="none";if(f=="bright")cam.style.filter="brightness(1.35)";if(f=="warm")cam.style.filter="sepia(.3)";if(f=="bw")cam.style.filter="grayscale(1)";document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("on"));el.classList.add("on")}window.onload=start</script></body></html>
