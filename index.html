<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riflive</title>
<style>
 body { margin:0; background:#000; color:#fff; font-family: sans-serif; }
 .live { height:50vh; background:#111; display:flex; align-items:center; justify-content:center; border-bottom:2px solid #333; }
 .chats { display:flex; height:40vh; }
 .chat { flex:1; padding:10px; overflow-y:auto; }
 .chat:first-child { border-right:1px solid #333; }
 .vip { background:#1a1500; }
 .title { font-weight:bold; padding:8px; background:#222; margin:-10px -10px 10px -10px; }
 .vip .title { background:#ffaa00; color:#000; }
 .msg { margin:5px 0; font-size:13px; }
 .bottom { padding:10px; background:#000; border-top:1px solid #333; }
</style>
</head>
<body>
<div class="live">📹 Riflive - LIVE 1.3K</div>
<div class="chats">
  <div class="chat"><div class="title">💬 الدردشة</div><div class="msg">Youssef: واعر 🔥</div><div class="msg">Ahmed: منين نتا؟</div></div>
  <div class="chat vip"><div class="title">⭐ الساحة VIP</div><div class="msg">Karim أرسل أسد 🦁 - 100</div></div>
</div>
<div class="bottom">كتب تعليق... <button style="background:red;color:#fff;border:0;padding:5px 15px;border-radius:20px;">إرسال</button></div>
</body>
</html>
