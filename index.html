<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RifLive</title><style>body{background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}h1{font-size:32px}video{width:90%;max-width:360px;height:480px;background:#111;border-radius:20px;display:none;object-fit:cover}button{background:#0095f6;color:#fff;border:0;padding:14px 36px;border-radius:30px;font-size:19px;font-weight:bold;margin-top:20px}</style></head><body><h1>RifLive 🔵</h1><p>لايف الريف</p><video id="v" autoplay muted playsinline></video><button id="b" onclick="go()">🎥 بدا اللايف</button><div id="s" style="margin-top:12px"></div><script>async function go(){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('v').srcObject=s;document.getElementById('v').style.display='block';document.getElementById('b').innerHTML='🔴 مباشر';document.getElementById('s').innerText='✅ خدام!'}catch(e){document.getElementById('s').innerText='عطي السماح للكاميرا'}}</script></body></html>
