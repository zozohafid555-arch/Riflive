<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RifLive Video Comment</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}video#v{width:100%;height:100vh;object-fit:cover;position:absolute;top:0;left:0}#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}.live{background:#ff0050;padding:6px 12px;border-radius:20px;font-weight:bold}.viewers{background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px}#chat{position:absolute;bottom:90px;left:10px;right:10px;z-index:10;max-height:45vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.msg{background:rgba(0,0,0,0.5);padding:8px 12px;border-radius:16px;font-size:14px;backdrop-filter:blur(5px);max-width:85%}.msg video{width:120px;height:160px;border-radius:12px;object-fit:cover;display:block;margin-top:6px;position:static}#bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:8px;z-index:10}input{flex:1;background:rgba(255,255,255,0.15);border:0;padding:12px 16px;border-radius:30px;color:#fff;outline:none}#goBtn{background:#0095f6;border:0;padding:16px;border-radius:30px;color:#fff;font-size:18px;font-weight:bold;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;width:80%} .vidBtn{background:#ff0050;border:0;padding:12px 14px;border-radius:50%;color:#fff;font-size:18px}#center{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5}h1{font-size:36px}</style></head><body>
<video id="v" autoplay muted playsinline></video>
<div id="center"><h1>🔵 RifLive</h1><p>تعليق بالفيديو 🎥💬</p></div>
<div id="top" style="display:none"><span class="live">🔴 LIVE</span><span class="viewers" id="vi">👁️ 1</span></div>
<div id="chat"></div>
<div id="bottom" style="display:none"><input id="t" placeholder="كتب تعليق..."><button class="vidBtn" id="recBtn" onclick="toggleRec()">🎥</button><button onclick="send()" style="background:#0095f6;border:0;padding:12px 18px;border-radius:30px;color:#fff;font-weight:bold">إرسال</button></div>
<button id="goBtn" onclick="go()">🎥 بدا اللايف</button>
<video id="preview" style="display:none;position:absolute;bottom:100px;right:10px;width:100px;height:140px;border-radius:12px;z-index:11;border:2px solid #ff0050" autoplay muted playsinline></video>
<script>
let rec, chunks=[], isRec=false, c=1;
async function go(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true});document.getElementById('v').srcObject=s;document.getElementById('goBtn').style.display='none';document.getElementById('center').style.display='none';document.getElementById('top').style.display='flex';document.getElementById('bottom').style.display='flex';setInterval(()=>{c++;document.getElementById('vi').innerText='👁️ '+c},3000);addMsg("بدأ اللايف! صيفطو تعليقات فيديو 🎥","النظام")}catch(e){alert("عطي السماح للكاميرا")}}
function addMsg(txt,name,isVideoBlob){const d=document.createElement('div');d.className='msg';if(isVideoBlob){const url=URL.createObjectURL(txt);d.innerHTML=`<b>${name} 🎥:</b><video src="${url}" autoplay loop muted playsinline></video>`;}else{d.innerHTML=`<b>${name}:</b> ${txt}`;}document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight}
function send(){const i=document.getElementById('t');if(i.value){addMsg(i.value,"أنت");i.value=""}}
async function toggleRec(){if(!isRec){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('preview').srcObject=s;document.getElementById('preview').style.display='block';chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});addMsg(blob,"أنت",true);s.getTracks().forEach(t=>t.stop());document.getElementById('preview').style.display='none'};rec.start();isRec=true;document.getElementById('recBtn').innerText='⏹️';document.getElementById('recBtn').style.background='#00ff00';setTimeout(()=>{if(isRec)toggleRec()},5000)}catch(e){alert("عطي السماح") } } else { rec.stop(); isRec=false; document.getElementById('recBtn').innerText='🎥'; document.getElementById('recBtn').style.background='#ff0050';}}
</script></body></html>
