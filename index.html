<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RifLive PRO ⵣ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9B0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;justify-content:space-between;padding:10px 14px;align-items:center}
.tab{padding:8px 18px;border-radius:20px;border:none;font-weight:700;cursor:pointer;background:#eee}
.tab.active{background:black;color:white}
.page{display:none;flex:1;overflow:hidden;flex-direction:column}
.page.active{display:flex}
#liveWrap{position:relative;width:94%;height:38vh;margin:0 auto;background:black;border-radius:24px;overflow:hidden;flex-shrink:0}
#video{width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.badge span{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
.off{background:#eee}.live{background:red;color:white}
.ctrl{border:none;border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{background:#ffffffcc;border:none;padding:6px 12px;border-radius:15px;font-size:12px;white-space:nowrap}
#chatSection{flex:1;width:94%;margin:8px auto;background:white;border-radius:20px;padding:10px;display:flex;flex-direction:column;overflow:hidden}
#chatBox{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chatMsg{background:#f5f5f5;padding:10px 14px;border-radius:14px;width:fit-content;max-width:90%;position:relative;font-size:13px}
.chatMsg video{width:90px!important;height:120px!important;object-fit:cover;border-radius:12px;display:block;margin-top:6px}
.del{position:absolute;top:-6px;left:-6px;background:red;color:white;border:none;width:20px;height:20px;border-radius:50%}
#videoCommentArea{display:flex;align-items:center;gap:10px;background:#fff0f0;border:1px dashed #ff3b30;border-radius:14px;padding:8px 12px;margin-top:8px}
#videoCommentArea button{background:red;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:800;font-size:13px}
.smallRect{width:70px;height:95px;background:black;border-radius:10px;object-fit:cover;display:none}
/* زر ارسال طالع */
#inputBar{display:flex;gap:8px;padding:10px 0 40px;align-items:center;position:sticky;bottom:0;background:white;border-radius:16px;margin-top:8px}
.inpWrap{flex:1;background:#f5f5f5;border-radius:30px;display:flex;align-items:center;padding:10px 16px}
.inpWrap input{flex:1;border:none;outline:none;background:transparent;font-size:14px}
.sendBtn{background:black;color:white;border:none;padding:10px 20px;border-radius:30px;font-weight:800}
#postsFeed{width:94%;margin:0 auto;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}
.postCard{background:white;border-radius:20px;padding:14px;box-shadow:0 2px 8px #0001}
.postCard img,.postCard video{width:100%;border-radius:16px;margin-top:10px;max-height:400px;object-fit:cover;background:black}
.createBox{background:white;width:94%;margin:10px auto;border-radius:20px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.createBox input[type=text]{flex:1;min-width:120px;border:none;outline:none;background:#f5f5f5;padding:12px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="topbar"><div style="display:flex;gap:8px"><button class="tab" id="tabPosts" onclick="showPage('posts')">المنشورات</button><button class="tab active" id="tabLive" onclick="showPage('live')">لايف</button></div><b>RifLive PRO ⵣ</b></div>

<div id="page-live" class="page active">
 <div id="liveWrap">
   <video id="video" autoplay muted playsinline></video>
   <div id="ui">
     <div class="badge"><span id="offBadge" class="off">OFF</span><span class="live" style="margin-right:6px">• LIVE</span><span style="background:black;color:white;padding:5px 10px;border-radius:20px;margin-right:6px;font-size:12px">👀 1</span></div>
     <div>
       <div class="filters"><button onclick="setFilter('none')">عادي</button><button onclick="setFilter('bright')">✨ تبييض</button><button onclick="setFilter('warm')">☀️ دافي</button><button onclick="setFilter('bw')">⚫ أسود</button><button onclick="setFilter('rif')">ⵣ ريفي</button></div>
       <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="ctrl" style="background:#ffffffcc" onclick="flipCam()">🔄 قلب</button><button class="ctrl" style="background:white" onclick="startLive()">📷 شغل</button><button class="ctrl" style="background:red;color:white" onclick="toggleFullRec()" id="fullRecBtn">🔴 سجل</button><button class="ctrl" style="background:#00E676" onclick="shareLive()">↗️ بارطاجي</button></div>
     </div>
   </div>
 </div>
 <div id="chatSection">
   <div id="chatBox"></div>
   <div id="videoCommentArea">
     <button onclick="recordVideoComment()">🔴 فيديو 5s</button>
     <video id="smallPreview" class="smallRect" autoplay muted playsinline></video>
     <span style="font-size:11px;color:#666"></span>
   </div>
   <div id="inputBar">
     <button style="border:none;background:none;font-size:22px" onclick="sendGift()">❤️</button>
     <div class="inpWrap"><input id="msgInput" placeholder="كتب تعليق..."></div>
     <button class="sendBtn" onclick="sendMsg()">إرسال</button>
   </div>
 </div>
</div>

<div id="page-posts" class="page">
 <div class="createBox">
   <input id="postInput" type="text" placeholder="شنو كاين؟">
   <input type="file" id="postFile" accept="image/*,video/*" style="display:none">
   <button onclick="document.getElementById('postFile').click()" style="font-size:20px;border:none;background:#f5f5f5;padding:10px 14px;border-radius:20px">📷🎥</button>
   <button class="sendBtn" onclick="createPost()">نشر</button>
   <button onclick="if(confirm('تمسح كل المنشورات؟')){localStorage.removeItem('rif_posts');posts=[];renderPosts()}" style="border:none;background:#ff3b30;color:white;padding:10px 14px;border-radius:20px;font-size:12px">مسح الكل</button>
 </div>
 <div id="postsFeed"></div>
</div>

<script>
let video=document.getElementById('video'),chatBox=document.getElementById('chatBox'),smallPreview=document.getElementById('smallPreview'),currentStream=null,facing='user',mediaRecorder=null,chunks=[],fullChunks=[],isFullRec=false,userName=localStorage.getItem('rif_name')||'';
let posts=JSON.parse(localStorage.getItem('rif_posts')||'[]');
let selectedFileData=null,selectedFileType=null;
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.getElementById('tab'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');if(p==='posts')renderPosts()}
function getName(){if(!userName){userName=prompt('سميتك؟')||'ضيف';localStorage.setItem('rif_name',userName)}return userName}
async function startLive(){try{if(currentStream)currentStream.getTracks().forEach(t=>t.stop());let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});currentStream=s;video.srcObject=s;smallPreview.srcObject=s;document.getElementById('offBadge').textContent='ON';document.getElementById('offBadge').style.background='#00E676';mediaRecorder=new MediaRecorder(s);mediaRecorder.ondataavailable=e=>{if(e.data.size>0){chunks.push(e.data);if(isFullRec)fullChunks.push(e.data)}};mediaRecorder.onstop=()=>{if(chunks.length&&!isFullRec){let blob=new Blob(chunks,{type:'video/webm'});addChat(getName(),'',blob)}chunks=[];smallPreview.style.display='none'};}catch(e){alert('سمح للكاميرا والميكرو')}}
function flipCam(){facing=facing==='user'?'environment':'user';startLive()}
function setFilter(f){if(f==='none')video.style.filter='none';if(f==='bright')video.style.filter='brightness(1.3) contrast(1.1)';if(f==='warm')video.style.filter='sepia(.3) brightness(1.2)';if(f==='bw')video.style.filter='grayscale(1)';if(f==='rif')video.style.filter='saturate(1.8) contrast(1.2)'}
function toggleFullRec(){if(!currentStream)return alert('شغل الكاميرا');if(!isFullRec){fullChunks=[];isFullRec=true;document.getElementById('fullRecBtn').textContent='⏹️ وقف';if(mediaRecorder.state==='inactive')mediaRecorder.start(100)}else{isFullRec=false;document.getElementById('fullRecBtn').textContent='🔴 سجل';let blob=new Blob(fullChunks,{type:'video/webm'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='RifLive-Full.webm';a.click()}}
function shareLive(){if(navigator.share)navigator.share({title:'RifLive PRO',text:'تفرج فيا لايف',url:location.href});else{navigator.clipboard.writeText(location.href);alert('تم نسخ الرابط ✅')}}
function addChat(name,text,blob=null){let d=document.createElement('div');d.className='chatMsg';let content=`<b>${name}:</b> ${text} <span style="color:#999;font-size:10px">${new Date().toLocaleTimeString().slice(0,5)}</span>`;if(blob){let url=URL.createObjectURL(blob);content+=`<video src="${url}" autoplay loop muted controls></video><div style="display:flex;gap:6px;margin-top:6px"><button onclick="let a=document.createElement('a');a.href='${url}';a.download='RifLive.webm';a.click()" style="background:#007aff;color:white;border:none;padding:4px 10px;border-radius:8px;font-size:11px">💾 حفظ</button><button onclick="this.closest('.chatMsg').remove()" style="background:#ff3b30;color:white;border:none;padding:4px 10px;border-radius:8px;font-size:11px">🗑️</button></div>`}d.innerHTML=content+`<button class="del" onclick="this.parentElement.remove()">×</button>`;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function sendMsg(){let i=document.getElementById('msgInput');if(!i.value.trim())return;addChat(getName(),i.value);i.value=''}
function recordVideoComment(){if(!currentStream)return alert('شغل الكاميرا أولا');chunks=[];smallPreview.style.display='block';mediaRecorder.start();setTimeout(()=>{if(mediaRecorder.state==='recording'&&!isFullRec)mediaRecorder.stop()},5000)}
function sendGift(){addChat(getName(),'❤️🔥')}

document.getElementById('postFile').addEventListener('change',function(e){
 let file=e.target.files[0];if(!file)return;
 if(file.size>12*1024*1024){alert('الفيديو كبير بزاف - أقل من 12MB');return;}
 let reader=new FileReader();
 reader.onload=function(ev){selectedFileData=ev.target.result;selectedFileType=file.type.startsWith('video')?'video':'image';document.querySelector('.createBox').style.background='#e0ffe0';setTimeout(()=>document.querySelector('.createBox').style.background='white',1000);};
 reader.readAsDataURL(file);
});
function createPost(){
 let txt=document.getElementById('postInput').value.trim();
 if(!txt&&!selectedFileData){alert('كتب شي حاجة ولا اختار صورة/فيديو');return;}
 posts.unshift({name:getName(),text:txt,media:selectedFileData,type:selectedFileType,time:Date.now(),likes:0});
 try{localStorage.setItem('rif_posts',JSON.stringify(posts));}catch(err){alert('الذاكرة عامرة - حيد شي منشورات قدام');posts.pop();}
 document.getElementById('postInput').value='';selectedFileData=null;selectedFileType=null;document.getElementById('postFile').value='';
 renderPosts();showPage('posts');
}
function renderPosts(){
 let feed=document.getElementById('postsFeed');feed.innerHTML='';
 if(posts.length===0){feed.innerHTML='<div style="text-align:center;padding:40px;color:#999">لا يوجد منشورات بعد<br>كن أول واحد ينشر! ⵣ</div>';return;}
 posts.forEach((p,i)=>{
  let mediaHtml='';if(p.media){if(p.type==='video')mediaHtml=`<video src="${p.media}" controls playsinline></video>`;else mediaHtml=`<img src="${p.media}">`}
  let div=document.createElement('div');div.className='postCard';
  div.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${p.name}</b><span style="color:#999;font-size:11px">${new Date(p.time).toLocaleString()}</span></div><div style="margin-top:6px">${p.text||''}</div>${mediaHtml}<div style="margin-top:10px;display:flex;gap:8px"><button onclick="posts[${i}].likes++;localStorage.setItem('rif_posts',JSON.stringify(posts));renderPosts()" style="border:none;background:#f5f5f5;padding:8px 14px;border-radius:20px">❤️ ${p.likes}</button><button onclick="if(confirm('تمسح؟')){posts.splice(${i},1);localStorage.setItem('rif_posts',JSON.stringify(posts));renderPosts()}" style="border:none;background:#ffe0e0;padding:8px 14px;border-radius:20px">🗑️ مسح</button></div>`;
  feed.appendChild(div);
 });
}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
renderPosts();
</script>
</body>
</html>
