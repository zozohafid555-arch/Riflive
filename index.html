<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RifLive - قريب وخا بعيد 🪐</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
body{font-family:'Tajawal',sans-serif;background:#0a0a0f;color:white}
.saturn{animation:spin 8s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.red-dot{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="pb-20">

<!-- HEADER -->
<header class="p-4 flex justify-between items-center sticky top-0 bg-[#0a0a0f]/80 backdrop-blur z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-200 to-orange-500 flex items-center justify-center saturn">🪐</div>
<div><h1 class="font-black text-lg">RifLive</h1><p class="text-[10px] text-gray-400 -mt-1">قريب وخا بعيد</p></div>
</div>
<div id="notifBell" class="relative"><i class="fa-solid fa-bell text-xl"></i><span id="redCount" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-600 rounded-full text-[10px] flex items-center justify-center red-dot">0</span></div>
</header>

<!-- TABS -->
<div class="flex gap-2 px-4 mt-2">
<button onclick="showTab('live')" id="tab-live" class="flex-1 py-3 rounded-2xl bg-white text-black font-bold"><i class="fa-solid fa-video"></i> لايف</button>
<button onclick="showTab('market')" id="tab-market" class="flex-1 py-3 rounded-2xl glass">🛒 السوق</button>
<button onclick="showTab('comments')" id="tab-comments" class="flex-1 py-3 rounded-2xl glass">💬 تعاليق</button>
</div>

<!-- LIVE TAB -->
<div id="page-live" class="p-4">
<div class="glass rounded-[2rem] overflow-hidden relative aspect-[9/14] max-w-sm mx-auto">
<video id="myCam" autoplay muted playsinline class="w-full h-full object-cover bg-black"></video>
<video id="remoteCam" autoplay playsinline class="absolute w-28 h-36 rounded-2xl bottom-20 left-3 border-2 border-white object-cover bg-gray-900 hidden"></video>
<div class="absolute top-4 left-4 right-4 flex justify-between">
<span class="bg-red-600 px-3 py-1 rounded-full text-xs font-bold red-dot">● LIVE</span>
<span id="viewers" class="glass px-3 py-1 rounded-full text-xs"><i class="fa-solid fa-eye"></i> 1</span>
</div>
<div class="absolute bottom-4 left-4 right-4 flex gap-2">
<button onclick="startCam()" class="flex-1 bg-white text-black py-3 rounded-full font-bold"><i class="fa-solid fa-camera"></i> شغل الكاميرا</button>
<button onclick="toggleMic()" id="micBtn" class="w-12 h-12 rounded-full bg-gray-800"><i class="fa-solid fa-microphone"></i></button>
<button onclick="shareScreen()" class="w-12 h-12 rounded-full bg-gray-800"><i class="fa-solid fa-display"></i></button>
</div>
</div>

<!-- Comment on Live -->
<div class="max-w-sm mx-auto mt-4 flex gap-2">
<input id="liveComment" placeholder="كتب تعليق..." class="flex-1 glass rounded-full px-4 py-3 outline-none">
<button onclick="addComment(false)" class="bg-white text-black px-5 rounded-full font-bold">إرسال</button>
<button onclick="addComment(true)" class="bg-red-600 px-4 rounded-full" title="تنبيه مهم"><i class="fa-solid fa-bell"></i>!</button>
</div>
</div>

<!-- MARKET TAB -->
<div id="page-market" class="p-4 hidden">
<h2 class="font-black text-xl mb-3">السوق الريفي 🏔️</h2>
<div class="grid grid-cols-2 gap-3" id="marketGrid"></div>
</div>

<!-- COMMENTS TAB -->
<div id="page-comments" class="p-4 hidden max-w-sm mx-auto">
<h2 class="font-black text-xl mb-3">كل التعاليق 💬</h2>
<div id="allComments" class="space-y-3"></div>
</div>

<!-- PRODUCT MODAL -->
<div id="prodModal" class="fixed inset-0 bg-black/80 backdrop-blur hidden z-[100] p-4 flex items-end">
<div class="glass rounded-[2rem] w-full max-w-sm mx-auto p-4
