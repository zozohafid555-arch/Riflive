<title>RifLive PRO ⵣ</title>

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFF9B0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;justify-content:space-between;padding:10px 14px}
.tab{padding:7px 16px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.tab.active{background:black;color:white}
.page{display:none;flex:1;overflow:hidden;flex-direction:column}

#liveWrap{position:relative;width:94%;height:38vh;margin:0 auto;background:black;border-radius:24px;overflow:hidden;flex-shrink:0}
#video{width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.badge span{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
.off{background:#eee}.live{background:red;color:white}
#controls{display:flex;gap:6px;flex-wrap:wrap}
.ctrl{border:none;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px}
.flip{background:#ffffffcc}.rec{background:red;color:white}.share{background:#00E676}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{background:#ffffffaa;border:none;padding:6px 10px;border-radius:15px;font-size:11px;white-space:nowrap}
#chatSection{flex:1;width:94%;margin:8px auto;background:white;border-radius:20px;padding:10px;display:flex;flex-direction:column;overflow:hidden}
#chatBox{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chatMsg{background:#f5f5f5;padding:8px 12px;border-radius:14px;width:fit-content;max-width:90%;position:relative;font-size:13px}
.chatMsg video{width:90px!important;height:120px!important;object-fit:cover;border-radius:10px;display:block;margin-top:6px}
.del{position:absolute;top:-6px;left:-6px;background:red;color:white;border:none;width:18px;height:18px;border-radius:50%;font-size:10px}
#videoCommentArea{display:flex;align-items:center;gap:8px;background:#fff0f0;border:1px dashed #ff3b30;border-radius:14px;padding:6px 10px;margin-top:8px}
#videoCommentArea button{background:#ff0000;color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:800;font-size:12px;white-space:nowrap}
.smallRect{width:70px;height:95px;background:black;border-radius:10px;object-fit:cover;display:none}
#inputBar{display:flex;gap:8px;padding:10px 0 20px;align-items:center}
.inpWrap{flex:1;background:#f5f5f5;border-radius:30px;display:flex;align-items:center;padding:8px 14px}
.inpWrap input{flex:1;border:none;outline:none;background:transparent;font-size:14px}
.sendBtn{background:black;color:white;border:none;padding:10px 18px;border-radius:30px;font-weight:800}
#postsFeed{width:94%;margin:0 auto;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
