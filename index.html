<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riflive - 5 دقايق</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#live{flex:3;position:relative;background:#111}
#live video{width:100%;height:100%;object-fit:cover}
#guest{position:absolute;right:10px;top:60px;width:120px;height:160px;border:3px solid #00ff00;border-radius:14px;overflow:hidden;background:#222;z-index:20;touch-action:none}
#guest video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.badge{position:absolute;top:15px;left:15px;background:red;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:13px}
#timer{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:8px 18px;border-radius:20px;font-weight:bold;color:#00ff00;display:none;z-index:30;border:1px solid #00ff00}
#chats{flex:2;display:flex;min-height:0}
.col{flex:1;overflow-y:auto;padding:6px}
.col:first-child{background:#121212;border-left:1px solid #333}
.col:last-child{background:#0a1a00}
.t{padding:8px;background:#333;font-weight:bold;font-size:12px;margin:-6px -6px 6px -6px;position:sticky;top:0;z-index:2}
.vip.t{background:#00ff00;color:#000}
.m{margin:6px 0;padding:8px 10px;border-radius:12px;font-size:12px;background:#222;cursor:pointer;word-break:break-word}
.vip.m{background:#fff;color:#000;font-weight:bold;border:2px solid #00ff00}
#bottom{padding:10px;background:#000;border-top:1px solid #333;display:flex;gap:8px;align-items:center}
#bottom input{flex:1;padding:12px 15px;border-radius:25px;border:0;background:#222;color:#fff;outline:none}
.btn{padding:11px 16px;border-radius:25px;border:0;font-weight:bold;cursor:pointer;font-size:13px}
.red{background:red;color:#fff}
.gold{background:#00ff00;color:#000}
.gold.rec{background:red;color:#fff;animation:pulse 0.8s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.5}}
#videoModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#videoModal video{width:92%;max-width:380px;height:62%;background:#222;border-radius:18px;border:3px solid #00ff00}
</style>
</head>
<body>

<div id="live">
  <video id="mainCam" autoplay muted playsinline></video>
  <div id="guest"><video id="guestCam" autoplay muted playsinline></video></div>
  <div class="badge">🔴 LIVE - Riflive</div>
  <div id="timer">⏱️ 00:00 / 05:00</div>
</div>

<div id="chats">
  <div class="col" id="c1"><div class="t">💬 الدردشة العادية</div></div>
  <div class="col vip" id="c2"><div class="t">🎥 فيديو - الحد 5 دقايق</div></div>
</div>

<div id="bottom">
  <button class="btn gold" id="vidBtn" onclick="toggleRec()">📹 سجل (5د)</button>
  <input id="inp" placeholder="كتب تعليق...">
  <button class="btn red" onclick="sendText()">إرسال</button>
</div>

<div id="videoModal" onclick="this.style.display='none'">
  <video id="bigVideo" autoplay controls playsinline></video>
  <button style="margin-top:15px;padding:12px 35px;border-radius:25px;border:0;background:#00ff00;font-weight:bold">إغلاق ✕</button>
  <p style="margin-top:8px;color:#00ff00;font-size:12px">الحد الأقصى 5 دقايق</p>
</div>

<script>
let stream, recorder, chunks=[], isRec=false, recTimer, sec=0;
const MAX_SEC = 5*60; // 5 دقايق حسن

async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    document.getElementById('mainCam').srcObject=stream;
    document.getElementById('guestCam').srcObject=stream;
  }catch(e){alert("سمح للكاميرا: "+e.message)}
}
function sendText(){
  let i=document.getElementById('inp'); if(!i.value.trim())return;
  let d=document.createElement('div'); d.className='m'; d.textContent='أنت: '+i.value;
  document.getElementById('c1').appendChild(d); i.value='';
  document.getElementById('c1').scrollTop=document.getElementById('c1').scrollHeight;
}
function toggleRec(){ if(!isRec) startRec(); else stopRec(); }
function startRec(){
  chunks=[]; sec=0; isRec=true;
  document.getElementById('timer').style.display='block';
  document.getElementById('vidBtn').textContent='⏹️ وقف';
  document.getElementById('vidBtn').classList.add('rec');
  recorder=new MediaRecorder(stream, {mimeType:'video/webm'});
  recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data)};
  recorder.onstop=saveVideo;
  recorder.start(100);
  recTimer=setInterval(()=>{
    sec++;
    let m=String(Math.floor(sec/60)).padStart(2,'0');
    let s=String(sec%60).padStart(2,'0');
    document.getElementById('timer').textContent=`⏱️ ${m}:${s} / 05:00`;
    if(sec>=MAX_SEC){ stopRec(); alert('وصلتي 5 دقايق - تسجل ✅'); }
  },1000);
}
function stopRec(){
  if(!isRec) return;
  isRec=false;
  clearInterval(recTimer);
  document.getElementById('timer').style.display='none';
  document.getElementById('vidBtn').textContent='📹 سجل (5د)';
  document.getElementById('vidBtn').classList.remove('rec');
  if(recorder && recorder.state=='recording') recorder.stop();
}
function saveVideo(){
  let blob=new Blob(chunks,{type:'video/webm'});
  let url=URL.createObjectURL(blob);
  let d=document.createElement('div');
  d.className='m vip';
  let mins=(sec/60).toFixed(1);
  d.innerHTML=`▶️ فيديو ${mins}د - اضغط تشوف`;
  d.onclick=()=>{
    let mv=document.getElementById('bigVideo');
    mv.src=url; document.getElementById('videoModal').style.display='flex';
  };
  document.getElementById('c2').appendChild(d);
  document.getElementById('c2').scrollTop=document.getElementById('c2').scrollHeight;
}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter') sendText()});
let g=document.getElementById('guest'), drag=false, sx, sy, il, it;
g.addEventListener('touchstart',e=>{drag=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; il=g.offsetLeft; it=g.offsetTop},{passive:false});
g.addEventListener('mousedown',e=>{drag=true; sx=e.clientX; sy=e.clientY; il=g.offsetLeft; it=g.offsetTop});
window.addEventListener('touchmove',e=>{if(!drag)return; e.preventDefault(); g.style.left=(il+e.touches[0].clientX-sx)+'px'; g.style.top=(it+e.touches[0].clientY-sy)+'px'; g.style.right='auto'},{passive:false});
window.addEventListener('mousemove',e=>{if(!drag)return; g.style.left=(il+e.clientX-sx)+'px'; g.style.top=(it+e.clientY-sy)+'px'; g.style.right='auto'});
window.addEventListener('touchend',()=>drag=false); window.addEventListener('mouseup',()=>drag=false);
startCam();
</script>
</body>
</html>
