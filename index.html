<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rif Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#loginScreen{position:fixed;inset:0;background:white;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}
#liveWrap{position:fixed;inset:0;width:100%;height:100%;background:#000}
#video{width:100%;height:100%;object-fit:cover}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none}
#ui > *{pointer-events:auto}
.top{ display:flex; justify-content:space-between; align-items:center}
.liveBadge{background:#e6003c;color:white;padding:6px 14px;border-radius:6px;font-weight:bold;font-size:12px}
.sysMsg{background:rgba(255,255,255,0.9);color:black!important;padding:8px 12px;border-radius:15px;font-size:13px;display:flex;align-items:center;gap:8px;width:fit-content;max-width:75%;margin-top:10px}
.rightTools{position:absolute;left:12px;bottom:90px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rightTools span{font-size:22px;background:rgba(255,255,255,0.15);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;backdrop-filter:blur(5px)}
#chatBox{position:absolute;bottom:70px;right:12px;left:70px;display:flex;flex-direction:column;gap:8px;max-height:25vh;overflow-y:auto}
.chatMsg{background:white!important;color:black!important;padding:8px 14px;border-radius:16px;font-size:13px;width:fit-content;max-width:90%;border:1px solid #eee}
#inputBar{position:absolute;bottom:12px;right:12px;left:12px;background:rgba(255,255,255,0.9);border-radius:25px;padding:8px 12px;display:flex;align-items:center;gap:8px}
#inputBar input{flex:1;border:none;background:transparent;outline:none;color:black}
</style>
</head>
<body>

<div id="loginScreen">
<h2 style="color:black;font-size:32px">🔴 Rif Live</h2>
<p style="color:black;margin:10px">مرحبا بك</p>
<button onclick="localStorage.setItem('rif_login','yes');this.parentElement.style.display='none';startLive()" style="background:red;color:white;padding:12px 30px;border:none;border-radius:10px;font-weight:bold">دخول</button>
</div>

<div id="liveWrap">
<video id="video" autoplay muted playsinline></video>
<div id="ui">
<div class="top">
<span class="liveBadge">LIVE</span>
<span style="color:white">rif1@ ⚙️</span>
</div>

<div class="sysMsg"><span style="color:red">❌</span> نظام 🧹 مسح كل التعليقات</div>

<div id="chatBox"></div>

<div class="rightTools">
<span>❤️</span>
<span>🎥</span>
<span style="background:#4da3ff">↗️</span>
</div>

<div id="inputBar">
<span>😊</span>
<input id="msgInput" placeholder="أضف تعليقا...">
<span style="color:#ff0050">📌</span>
</div>
</div>
</div>

<script>
let video=document.getElementById('video');
function startLive(){
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>video.srcObject=s).catch(()=>video.style.background='#111');
 addChat('نظام','تم حفظ الفيديو ✅',true);
}
function addChat(name,text,isSystem){
 const d=document.createElement('div'); d.className='chatMsg';
 d.innerHTML=isSystem?`<b style="color:#ff8a00">نظام:</b> ${text}`:`<b>${name}:</b> ${text}`;
 document.getElementById('chatBox').appendChild(d);
}
function sendMsg(){
 let i=document.getElementById('msgInput'); if(!i.value)return;
 addChat('انت',i.value); i.value='';
}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
if(localStorage.getItem('rif_login')==='yes'){document.getElementById('loginScreen').style.display='none';startLive();}
</script>
</body>
</html>
